name: Pipeline

# ONE workflow for every state-changing job (scan/eod/weekly/monthly). State
# (DuckDB + snapshots/registry/ledger/trials) is carried between runs as an
# encrypted (`turboedge state pack`, TURBOEDGE_STATE_KEY) workflow artifact
# rather than the previous scan-report.yml GitHub Actions cache, which
# silently expires after 7 days of inactivity -- see `turboedge.state`
# (Build Contract v2, W3).
#
# Three artifact shapes, all encrypted with TURBOEDGE_STATE_KEY
# (unbounded-growth fix, state/archive.py -- see its module docstring
# "Parquet archiving" for the full history, including a bug in the
# original two-shape version of this scheme, fixed below):
#   - `turboedge-state-enc` (14-day retention): the LEAN shape every job
#     packs several times a day -- everything except state/snapshots/, the
#     immutable per-run Parquet archive (storage/snapshots.py), which has
#     no retention policy of its own and does not belong in an artifact
#     re-uploaded that often. This is the one every restore uses in the
#     normal path.
#   - `turboedge-state-backup-enc` (90-day retention): the SAME lean shape,
#     packed a second time by the weekly job only, purely as a
#     longer-retained DuckDB/ledger/registry/trials restore point in case
#     an incident isn't noticed within the lean chain's ~14-day rolling
#     window. Not automatically restored by anything -- a deliberate,
#     manual `gh run download` + `state unpack` if it's ever needed.
#   - `turboedge-snapshots-<run_id>` (90-day retention, scan job only): the
#     INCREMENTAL Parquet snapshot artifact -- packs ONLY the
#     state/snapshots/ file(s) that THIS run's `scan-all` itself just wrote
#     (`state pack-snapshots`, keyed by the run_ids in
#     reports/summary.json), not the whole accumulated history. This is
#     what actually keeps the Parquet archive durable now: an earlier
#     version of this scheme instead packed the *entire* state/snapshots/
#     tree once a week from the `weekly` job -- but `weekly` never scans,
#     so that could only ever re-upload whatever had already accumulated
#     before the scheme shipped, never anything a scan run wrote
#     afterwards. See the scan job's "Pack incremental Parquet snapshot
#     artifact" step and state/archive.py's module docstring for the fix.
#
# This is a public repository: GitHub Actions logs, job summaries and
# artifacts are visible to anyone. TURBOEDGE_PUBLIC_LOGS=1 (below) makes the
# CLI redact ISIN/WKN/prices from stdout and structured logs (see
# `turboedge.logging.redact_enabled`); no unencrypted report is ever
# uploaded as an artifact; the job summary carries only counts from
# `reports/summary.json` (a Wave 2 convention: `{"mode": ..., "counts": {...}}`).
#
# The setup/restore/unpack (~100 lines) and job-summary (~35 lines) steps
# that used to be duplicated across all four mode jobs now live in local
# composite actions under `.github/actions/`:
#   - `turboedge-state`         checkout->this: setup uv/Python, verify
#                                 TURBOEDGE_STATE_KEY, restore + unpack the
#                                 lean state artifact.
#   - `turboedge-state-summary` writes the job summary (counts + an optional
#                                 state-restore note).
#   - `turboedge-state-pack`    packs and uploads the lean shape (default)
#                                 or, when the weekly job passes
#                                 `retention_days`/`artifact_name` overrides,
#                                 the same lean shape under a longer
#                                 retention window (see
#                                 `turboedge-state-backup-enc` above);
#                                 callers gate this with `if: success()` so a
#                                 failed mode step never uploads a broken
#                                 state over the last good artifact history.
# Each job keeps only its own `Checkout code` step plus whatever is unique to
# its mode -- see the comments on the composite actions themselves for why
# the restore step never silently starts from an empty state, and for the
# `--limit 50` search-depth choice.
#
# Phase H, "dauerhafte Lernhistorie": every artifact shape above is still
# bounded (14 or 90 days) by GitHub's own retention limits. An OPTIONAL
# durable state backend (`turboedge.state.backend`, TURBOEDGE_STATE_BACKEND
# below) sits underneath all of it as a fallback, not a replacement: the
# `eod` job additionally pushes its packed archive there (bounded growth --
# once/day, not the scan job's 5x/day), and `turboedge-state`'s restore
# tries it if -- and only if -- no usable GitHub artifact was found in the
# last 50 successful runs. Unset TURBOEDGE_STATE_BACKEND and every job
# behaves exactly as before this existed. See docs/durable_state.md.

on:
  schedule:
    # All times UTC, Monday-Friday unless noted.
    - cron: "40 7 * * 1-5" # scan
    - cron: "10 10 * * 1-5" # scan
    - cron: "45 13 * * 1-5" # scan
    - cron: "50 15 * * 1-5" # scan
    - cron: "10 18 * * 1-5" # scan
    - cron: "40 21 * * 1-5" # eod
    # One hour after eod, deliberately its own run rather than another job
    # inside eod's: `concurrency: turboedge-state` with cancel-in-progress
    # false serialises runs, so this restores the state eod has just saved,
    # adds to it and saves again. Two jobs in ONE run would both restore
    # the same state and both pack it, and the second upload would silently
    # discard the first job's writes.
    - cron: "40 22 * * 1-5" # external
    - cron: "0 6 * * 6" # weekly (Saturday)
    # Saturdays, after the weekly tournament has refreshed walk-forward
    # results and re-scored the queue, so the autonomous loop decides on
    # the freshest evidence available.
    - cron: "40 8 * * 6" # research
    - cron: "30 6 1 * *" # monthly (1st of month)
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode to run"
        required: true
        type: choice
        options:
          - scan
          - eod
          - external
          - research
          - weekly
          - monthly
      allow_fresh_state:
        description: >-
          Force a fresh, empty state if no usable turboedge-state-enc
          artifact can be found (deliberate reset only -- leave false for a
          normal manual run; see `.github/actions/turboedge-state/action.yml`)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: turboedge-state
  cancel-in-progress: false

env:
  TURBOEDGE_PUBLIC_LOGS: "1"
  # Phase H, "dauerhafte Lernhistorie": optional durable state backend
  # (turboedge.state.backend) underneath the GitHub Actions artifact above
  # -- see docs/durable_state.md. Entirely opt-in: when the
  # TURBOEDGE_STATE_BACKEND secret does not exist, GitHub Actions resolves
  # it to an empty string, `turboedge state backend *` fails fast without
  # any network call, and every job behaves exactly as it did before this
  # feature existed. Set at workflow level (not per-job) so the restore
  # composite action's case-B fallback (every mode) and the eod job's
  # durable push both see the same configuration without threading six
  # separate inputs through two composite actions. Never printed/logged by
  # anything in this repo -- job env values do not appear in `::error::`/
  # `::warning::`/console output unless a step explicitly echoes them, and
  # nothing here does.
  TURBOEDGE_STATE_BACKEND: ${{ secrets.TURBOEDGE_STATE_BACKEND }}
  TURBOEDGE_STATE_S3_BUCKET: ${{ secrets.TURBOEDGE_STATE_S3_BUCKET }}
  TURBOEDGE_STATE_S3_ACCESS_KEY_ID: ${{ secrets.TURBOEDGE_STATE_S3_ACCESS_KEY_ID }}
  TURBOEDGE_STATE_S3_SECRET_ACCESS_KEY: ${{ secrets.TURBOEDGE_STATE_S3_SECRET_ACCESS_KEY }}
  TURBOEDGE_STATE_S3_ENDPOINT_URL: ${{ secrets.TURBOEDGE_STATE_S3_ENDPOINT_URL }}
  TURBOEDGE_STATE_S3_REGION: ${{ secrets.TURBOEDGE_STATE_S3_REGION }}
  TURBOEDGE_STATE_S3_PREFIX: ${{ secrets.TURBOEDGE_STATE_S3_PREFIX }}

jobs:
  # ---------------------------------------------------------------------
  # Resolve which mode this trigger corresponds to, once, so every
  # downstream job can gate on a single `needs.resolve-mode.outputs.mode`
  # comparison instead of re-deriving it. All trigger-derived values are
  # threaded through `env:` rather than interpolated directly into `run:`.
  # ---------------------------------------------------------------------
  resolve-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
    steps:
      - name: Resolve mode from trigger
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            schedule)
              case "$SCHEDULE_CRON" in
                "40 7 * * 1-5"|"10 10 * * 1-5"|"45 13 * * 1-5"|"50 15 * * 1-5"|"10 18 * * 1-5")
                  mode="scan" ;;
                "40 21 * * 1-5") mode="eod" ;;
                "40 22 * * 1-5") mode="external" ;;
                "0 6 * * 6") mode="weekly" ;;
                "40 8 * * 6") mode="research" ;;
                "30 6 1 * *") mode="monthly" ;;
                *)
                  echo "::error::unrecognized schedule cron: $SCHEDULE_CRON"
                  exit 2
                  ;;
              esac
              ;;
            workflow_dispatch)
              mode="$DISPATCH_MODE"
              ;;
            *)
              echo "::error::unsupported trigger event: $EVENT_NAME"
              exit 2
              ;;
          esac
          case "$mode" in
            scan|eod|external|research|weekly|monthly) ;;
            *)
              echo "::error::invalid resolved mode: $mode"
              exit 2
              ;;
          esac
          echo "Resolved mode: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # health-watch lives in its own workflow (.github/workflows/health-watch.yml),
  # NOT as a job here, and the reason is measured.
  #
  # It was a job here until 2026-10-24. A failing job fails the run, and
  # `.github/actions/turboedge-state` restores from
  # `gh run list --workflow pipeline.yml --status success` -- so a run whose
  # watchdog failed became invisible to the restore even though its data jobs
  # had succeeded and packed state. Checked against the Actions API: all
  # eight runs reported `failure` on 2026-10-23/24 had uploaded
  # `turboedge-state-enc`, every one of those artifacts was unreachable, and
  # the newest state the pipeline could restore was from 12:49 that day --
  # discarding a successful 65-minute external ingest and a successful eod.
  #
  # A watchdog built to make silent data loss audible was causing it. It
  # reads only the Actions API and needs no state, so it has no business
  # being able to colour this workflow's conclusion.
  # ---------------------------------------------------------------------

  # ---------------------------------------------------------------------
  # scan -- Mo-Fr, 5x/day
  # ---------------------------------------------------------------------
  scan:
    needs: resolve-mode
    if: needs.resolve-mode.outputs.mode == 'scan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore TurboEdge state
        id: state
        uses: ./.github/actions/turboedge-state
        with:
          state_key: ${{ secrets.TURBOEDGE_STATE_KEY }}
          mode: scan
          allow_fresh_state: ${{ inputs.allow_fresh_state }}
          github_token: ${{ github.token }}

      - name: Run scan
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TURBOEDGE_EMAIL_TO: ${{ secrets.TURBOEDGE_EMAIL_TO }}
        run: uv run turboedge --log-format json scan-all --email

      # Compacting here as well as in `eod` is insurance, not an
      # optimisation: measured saving is only ~0.65 MB/day, because
      # same-day rows are inside keep_days no matter how often this runs.
      # It matters because scheduled runs genuinely go missing -- on
      # 2026-09-14 only one of three scheduled scans fired, and 37 minutes
      # late -- so an `eod` that never starts would mean nothing is ever
      # compacted. Must run before the state is packed below, otherwise the
      # uncompacted database is what gets uploaded.
      - name: Compact product_snapshots retention
        run: uv run turboedge --log-format json db compact

      # ------------------------------------------------------------------
      # Incremental Parquet snapshot artifact (unbounded-growth fix,
      # follow-up): `scan-all` just wrote one immutable Parquet file per
      # scanned underlying (storage/snapshots.py's write_snapshot_parquet)
      # under state/snapshots/, keyed by the run_id `scan-all` itself
      # generated per underlying (now recorded in reports/summary.json's
      # `run_ids` field -- see cli_learn.py's scan_all_cmd). This step packs
      # and uploads ONLY those files, not the whole accumulated
      # state/snapshots/ history -- see state/archive.py's module docstring
      # ("Parquet archiving") for why: state/snapshots/ is written only
      # during scan/scan-all, `weekly` never scans, and the old scheme's
      # weekly-only full archive could therefore never actually carry
      # forward a scan run's new output, only whatever had already
      # accumulated before that scheme shipped. Uploaded under its own,
      # per-workflow-run-unique artifact name (github.run_id) so successive
      # scans on the same day never overwrite each other's artifact.
      # ------------------------------------------------------------------
      - name: Pack incremental Parquet snapshot artifact (this run's new files only)
        if: success()
        env:
          TURBOEDGE_STATE_KEY: ${{ secrets.TURBOEDGE_STATE_KEY }}
        run: |
          set -euo pipefail
          run_ids=$(python3 - <<'PY'
          import json

          try:
              with open("reports/summary.json", encoding="utf-8") as f:
                  data = json.load(f)
          except (OSError, json.JSONDecodeError):
              data = {}
          for run_id in (data.get("run_ids") or {}).values():
              print(run_id)
          PY
          )
          if [[ -z "${run_ids}" ]]; then
            echo "No run_ids in reports/summary.json -- nothing to pack this run."
            exit 0
          fi
          args=()
          while IFS= read -r id; do
            [[ -n "${id}" ]] && args+=(--run-id "${id}")
          done <<< "${run_ids}"
          uv run turboedge --state-dir ./state state pack-snapshots "${args[@]}" --out snapshot-batch.tar.enc

      - name: Upload incremental snapshot artifact
        if: success() && hashFiles('snapshot-batch.tar.enc') != ''
        uses: actions/upload-artifact@v4
        with:
          name: turboedge-snapshots-${{ github.run_id }}
          path: snapshot-batch.tar.enc
          retention-days: 90

      - name: Job summary
        if: always()
        uses: ./.github/actions/turboedge-state-summary
        with:
          mode: scan
          state_note: ${{ steps.state.outputs.state_note }}

      - name: Pack and upload state
        if: success()
        uses: ./.github/actions/turboedge-state-pack
        with:
          state_key: ${{ secrets.TURBOEDGE_STATE_KEY }}

  # ---------------------------------------------------------------------
  # eod -- Mo-Fr, once, after market close: label -> learn -> reevaluate ->
  # compact
  # ---------------------------------------------------------------------
  eod:
    needs: resolve-mode
    if: needs.resolve-mode.outputs.mode == 'eod'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore TurboEdge state
        id: state
        uses: ./.github/actions/turboedge-state
        with:
          state_key: ${{ secrets.TURBOEDGE_STATE_KEY }}
          mode: eod
          allow_fresh_state: ${{ inputs.allow_fresh_state }}
          github_token: ${{ github.token }}

      - name: Label due forward-ledger entries
        run: uv run turboedge --log-format json label

      - name: Learn (posteriors, model weights, drift)
        run: uv run turboedge --log-format json learn

      - name: Reevaluate open positions
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TURBOEDGE_EMAIL_TO: ${{ secrets.TURBOEDGE_EMAIL_TO }}
        run: uv run turboedge --log-format json position reevaluate --email

      # Deep, slow, once-a-day full-depth product fetch (research only --
      # see pipeline/archive.py's module docstring). Deliberately placed in
      # `eod`, never one of the five daily `scan-all` invocations: gettex's
      # live-scan page cap (configs/sources.yaml, max_pages: 20) exists
      # because full-depth fetching adds ~120s per underlying at the
      # project's <=1 request/s politeness rule, which would push
      # decision-time quote age past configs/risk.yaml's
      # max_quote_age_at_decision_s and cause products to be rejected on
      # staleness -- more data on the scan path would mean fewer candidates,
      # not more. This command builds its own adapters and only overrides
      # gettex's page cap for its own call, so the scan path's configured
      # depth is completely unaffected. Writes product_snapshots/instruments
      # for research only -- no pricing, no EV, no gates, no ledger entry,
      # no notification -- and runs before `db compact` so today's deep
      # snapshots are subject to the same retention policy as everything
      # else.
      - name: Archive full-depth product universe (research only)
        run: uv run turboedge --log-format json archive products

      - name: Compact product_snapshots retention
        run: uv run turboedge --log-format json db compact

      # GOVERNANCE.md §11.1/§12 (2026-09-19 entry): the six documented W9
      # 2026Q3 trials were never actually written to `research_trials` in
      # any environment (this repo's local dev DB and CI's own separate DB
      # were both measured at 0 rows despite the changelog claiming the
      # backfill had already happened) -- `count_research_trials_in_quarter`
      # therefore undercounts the §1.2 quarterly adaptation budget wherever
      # this runs. `research backfill-trials` inserts a row per trial_id
      # only if that trial_id is not already present (research_trials'
      # primary key), so running it here every eod is a harmless no-op once
      # CI's own state DB has the six rows -- never re-inserts, never
      # duplicates, never raises on a re-run.
      - name: Backfill W9 2026Q3 research trials (idempotent bookkeeping fix)
        run: uv run turboedge --log-format json research backfill-trials

      - name: Job summary
        if: always()
        uses: ./.github/actions/turboedge-state-summary
        with:
          mode: eod
          state_note: ${{ steps.state.outputs.state_note }}

      # push_to_backend: "true" only here (not scan/weekly/monthly) -- eod
      # is the once-a-day checkpoint AFTER label -> learn -> reevaluate ->
      # compact, i.e. the most meaningfully-updated state of the day, and
      # once/day keeps a user's optional remote bucket growing at a bounded
      # rate rather than 5x/day. Entirely a no-op if TURBOEDGE_STATE_BACKEND
      # is unset -- see turboedge-state-pack/action.yml and
      # docs/durable_state.md.
      - name: Pack and upload state
        if: success()
        uses: ./.github/actions/turboedge-state-pack
        with:
          state_key: ${{ secrets.TURBOEDGE_STATE_KEY }}
          push_to_backend: "true"

  # ---------------------------------------------------------------------
  # external -- Mo-Fr, one hour after eod. The External Data Factory
  # (docs/external_data_factory.md).
  #
  # Its own run, for a reason paid for in 25 days of lost work. This used
  # to be two steps inside `eod`, which has `timeout-minutes: 30`, and the
  # ingest does not fit in what eod had left: PortWatch alone honours a
  # 60-second crawl delay across 11 series with paging, Energy-Charts
  # backfills 400 days on a first run, Destatis honours 30 seconds, and
  # FRED, EIA, GIE and e-Stat were added on top. Every eod run from
  # 2026-09-29 to 2026-10-23 hit the wall here and was cancelled.
  #
  # `continue-on-error` on the step did not help, and that was the real
  # misunderstanding: it catches a step that FAILS, not a job that runs out
  # of time. A timeout cancels the whole job, so every later step --
  # including "Pack and upload state" -- was skipped, and the night's
  # label/learn output was discarded with it.
  #
  # Separating it fixes both halves. A slow or broken publisher can now
  # cost at most this job, and eod's save no longer sits behind a fetch
  # that depends on eight external hosts.
  # ---------------------------------------------------------------------
  external:
    needs: resolve-mode
    if: needs.resolve-mode.outputs.mode == 'external'
    runs-on: ubuntu-latest
    # Generous on purpose. Measured locally 2026-09-28: a full first
    # backfill of the eight keyless sources took ~25 minutes, dominated by
    # PortWatch's crawl delay, and the five credentialed sources had never
    # run at all. Later runs are far shorter -- `_incremental_since` resumes
    # from the newest stored observation with a 14-day overlap -- but the
    # first successful run has to be able to finish, or it never becomes a
    # later run.
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore TurboEdge state
        id: state
        uses: ./.github/actions/turboedge-state
        with:
          state_key: ${{ secrets.TURBOEDGE_STATE_KEY }}
          mode: external
          allow_fresh_state: ${{ inputs.allow_fresh_state }}
          github_token: ${{ github.token }}

      # Still `continue-on-error`: an external publisher being down for an
      # evening is normal and must not fail the job that saves the data the
      # other publishers did deliver. The ingestion loop already records a
      # per-series failure and keeps the rest.
      #
      # Credentials are all optional. A source whose variable is unset
      # reports AUTH_MISSING and is skipped cleanly rather than attempted
      # and failed. No credential is ever written to the database, to a log
      # line, or into an archived request fingerprint.
      - name: Ingest external economic data (point-in-time archive)
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          ENTSOE_SECURITY_TOKEN: ${{ secrets.ENTSOE_SECURITY_TOKEN }}
        run: uv run turboedge --log-format json external ingest

      # Read-only. Prints what is usable and, for everything else, exactly
      # what is still missing -- so nobody has to track by hand when a
      # dataset has finally accumulated enough evidence.
      - name: Report data readiness
        continue-on-error: true
        run: uv run turboedge --log-format json external readiness --json-out reports/external/readiness.json

      - name: Job summary
        if: always()
        uses: ./.github/actions/turboedge-state-summary
        with:
          mode: external
          state_note: ${{ steps.state.outputs.state_note }}

      # `success()`, like every other caller, and for a reason that is
      # easy to get wrong: the restore action searches
      # `gh run list --status success`, so an artifact uploaded by a
      # cancelled or failed run is never read again. Uploading from a
      # broken run would buy nothing and contradict
      # turboedge-state-pack's documented contract. What makes this job's
      # state survive is not a looser condition -- it is that the two
      # fetch steps are `continue-on-error`, so a publisher being down
      # leaves the job successful and the save reachable.
      - name: Pack and upload state
        if: success()
        uses: ./.github/actions/turboedge-state-pack
        with:
          state_key: ${{ secrets.TURBOEDGE_STATE_KEY }}
          push_to_backend: "true"

  # ---------------------------------------------------------------------
  # research -- Saturday, after the weekly tournament. One cycle of the
  # autonomous research loop: re-score the queue, decide the next step,
  # record it.
  #
  # A mode of THIS workflow rather than a workflow of its own, and that was
  # a correction. A separate `research.yml` reads more cleanly and would
  # have broken state persistence silently: `.github/actions/turboedge-state`
  # searches `gh run list --workflow pipeline.yml --status success` for the
  # artifact to restore, so state packed by a different workflow would be
  # uploaded and then never read again -- the same shape of failure as
  # gating a save on a condition that never holds.
  #
  # Logical separation is preserved where it matters: its own run, its own
  # timeout, its own schedule, and nothing a scan or an eod depends on. The
  # `turboedge-state` concurrency group serialises it behind them rather
  # than racing for the artifact.
  #
  # What this job may do: decide, and record the decision. What it may NOT
  # do, and cannot: approve a question out of PROPOSED, start a confirmatory
  # trial, or promote an alpha. Those need a named human
  # (`meta/research_queue.approve`), and promotion is additionally blocked
  # while `alpha/promotion.py` has seven unset gates and GOVERNANCE.md
  # disagrees with configs/ranking.yaml about position and cluster limits.
  # ---------------------------------------------------------------------
  research:
    needs: resolve-mode
    if: needs.resolve-mode.outputs.mode == 'research'
    runs-on: ubuntu-latest
    # One decision plus a state round-trip. Bounded on purpose: an
    # unbounded research job is the one thing an autonomous loop must not
    # have.
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore TurboEdge state
        id: state
        uses: ./.github/actions/turboedge-state
        with:
          state_key: ${{ secrets.TURBOEDGE_STATE_KEY }}
          mode: research
          allow_fresh_state: ${{ inputs.allow_fresh_state }}
          github_token: ${{ github.token }}

      # Re-score first, so the decision ranks on current evidence rather
      # than on whatever the previous run left behind. `research queue` may
      # reorder freely and may only ever write PROPOSED.
      - name: Re-score the research queue
        run: uv run turboedge --log-format json research queue --limit 20

      # Idempotent within a quarter: a retried or repeated week reaches the
      # same conclusion and records nothing new, so scheduling cannot
      # inflate the research ledger -- which is the denominator the
      # multiple-testing correction depends on.
      - name: Decide the next research step
        run: uv run turboedge --log-format json research step

      - name: Job summary
        if: always()
        uses: ./.github/actions/turboedge-state-summary
        with:
          mode: research
          state_note: ${{ steps.state.outputs.state_note }}

      - name: Pack and upload state
        if: success()
        uses: ./.github/actions/turboedge-state-pack
        with:
          state_key: ${{ secrets.TURBOEDGE_STATE_KEY }}
          push_to_backend: "false"

  # ---------------------------------------------------------------------
  # weekly -- Saturday: research tournament + keepalive (re-enable every
  # workflow so GitHub's 60-day-idle auto-disable never silences the
  # scheduler on this public repo).
  #
  # Two anti-idle mechanisms, both needed:
  #   - "Keepalive" (API `enable` call) only helps if this `weekly` job
  #     itself still runs -- it does nothing once the scheduler has already
  #     been disabled.
  #   - GitHub's 60-day-idle disable is driven by *repository activity*
  #     (commits), not by workflow run history, so re-enabling workflows via
  #     the API is not itself activity that resets the idle clock. The
  #     "Heartbeat commit" step below makes an actual commit, but only once
  #     the repo has genuinely gone quiet for 30+ days -- see its comment.
  #
  # `weekly` is the only job with `contents: write` (to push the heartbeat
  # commit) and `actions: write` (to call the workflow enable API); every
  # other job only reads artifacts/state.
  # ---------------------------------------------------------------------
  weekly:
    needs: resolve-mode
    if: needs.resolve-mode.outputs.mode == 'weekly'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore TurboEdge state
        id: state
        uses: ./.github/actions/turboedge-state
        with:
          state_key: ${{ secrets.TURBOEDGE_STATE_KEY }}
          mode: weekly
          allow_fresh_state: ${{ inputs.allow_fresh_state }}
          github_token: ${{ github.token }}

      # Walk-forward measurement. This ran in no workflow at all until
      # 2026-09-26, so `walkforward_results` was empty in every environment
      # -- which is precisely why the Phase 1 meta-controller abstains on
      # every horizon: it reads that table for `historical_oos_quality` and
      # `calibration_quality`, found neither, and recorded both as unmeasured
      # rather than inventing a neutral value (docs/measured_results.md,
      # meta/trust.py). The tournament also prefers this table when present.
      #
      # It runs BEFORE the tournament so the same run's numbers are the ones
      # reported. ~20 minutes: it refits every model over the full history
      # per (underlying, horizon) cell.
      - name: Refresh walk-forward measurements
        run: uv run turboedge --log-format json backtest

      # Read-only measurements, reported but never acted on. Both are
      # expected to report "not enough data" for months (§6.9): the excursion
      # harness needs an effective sample in the hundreds and currently has
      # 1.00. Running them weekly is what makes the day they stop saying that
      # visible without anyone remembering to check.
      # Three outcomes, and only one of them may pass silently:
      #   0 SUCCESS           -- a valid evaluation ran
      #   3 INSUFFICIENT_DATA -- working, not enough matured observations yet
      #   * ERROR             -- a technical fault, which must fail the job
      #
      # A blanket `continue-on-error: true` used to cover all three, so a
      # real fault in the only research harness this system has was
      # indistinguishable from a young forward ledger. The exit code now
      # carries the distinction (`cli_learn.EXCURSION_INSUFFICIENT_DATA`).
      - name: Measure MAE/MFE excursion prediction
        run: |
          set -uo pipefail
          uv run turboedge --log-format json research excursion \
            --json-out reports/weekly/excursion.json
          status=$?
          if [ "${status}" -eq 0 ]; then
            echo "excursion: a valid evaluation ran"
          elif [ "${status}" -eq 3 ]; then
            echo "::notice::excursion reported INSUFFICIENT_DATA -- the evaluation works, not enough real observations have matured yet. Not a fault."
          else
            echo "::error::excursion exited ${status}: a technical fault, not a data shortage."
            exit "${status}"
          fi

      # The precondition for pre-registering the product-selection cost
      # question (docs/research_plan_product_selection_cost_edge.md, §4):
      # how often does the archive contain two genuinely comparable
      # products from different issuers? Read-only -- it computes no cost,
      # tests no hypothesis and opens no trial. `continue-on-error` because
      # a census that fails must not cost the weekly state save.
      - name: Count comparable cross-issuer product pairs (census only)
        continue-on-error: true
        run: |
          uv run turboedge --log-format json research product-pairs \
            --json-out reports/weekly/product_pairs.json

      - name: Re-score the research queue
        run: uv run turboedge --log-format json research queue --limit 14

      - name: Run weekly research tournament
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TURBOEDGE_EMAIL_TO: ${{ secrets.TURBOEDGE_EMAIL_TO }}
        run: uv run turboedge --log-format json research tournament --email

      # W10's out-of-sample P(KO) calibrator evaluation
      # (docs/measured_results.md §3.1) was run by hand exactly once, on
      # 2026-09-19, and never again -- `research_trials`/`runs` in every
      # environment show no `ko-calibration` run at all, and both
      # `ko_calibration_results` and `ko_calibration_promotion` are empty.
      # Its answer was NO PROMOTION (isotonic improves aggregate calibration
      # but flips the mean signed error at sigma 1.5/2.0 from conservative
      # to under-predicting KO risk; Platt degrades Brier outright), and
      # `ranking/gates.py` consequently still consumes raw P(KO). But that
      # answer is a property of the data as it stood on one day: more
      # history, or a different volatility regime, could change it in
      # either direction, and nothing would notice.
      #
      # Safe to automate precisely because a promotion here is a RECORD,
      # not an effect: nothing in ranking/, pipeline/ or simulation/ reads
      # `ko_calibration_promotion` or `ko_calibrator_version` (the command's
      # own --help says so: "Measurement only -- ranking/gates.py and
      # pipeline/scan.py are not touched by this command, even when a
      # calibrator is promoted"). A future promotion therefore lands in the
      # database for a human to review, and changes no gate on its own.
      #
      # Cost is negligible: measured 15.5s for one underlying locally
      # (64,880 observations), so ~1 min for all four, inside this job's
      # 60-minute timeout. A failed bar fetch falls back to stored bars
      # rather than aborting (cli_learn.py), and `continue-on-error` keeps
      # a genuinely unusable run (exit 3, "no usable observations") from
      # turning the tournament's own result red -- this is a research
      # measurement, not a gate on the weekly job.
      - name: Re-run the W10 KO-calibration measurement (records only, promotes nothing)
        continue-on-error: true
        run: uv run turboedge --log-format json research ko-calibration

      - name: Keepalive -- re-enable every workflow (public repos auto-disable after 60 days idle)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for wf in pipeline.yml source-health.yml tests.yml; do
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/enable"
          done

      - name: Heartbeat commit if the repo has been idle for 30+ days
        # Runs whether or not the tournament/keepalive steps above
        # succeeded (only skipped if the job itself was cancelled) --
        # keeping the scheduler alive matters especially on a red run,
        # since that is exactly when nobody else may be pushing commits.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          last_commit_ts=$(git log -1 --format=%ct origin/main)
          now_ts=$(date -u +%s)
          age_days=$(( (now_ts - last_commit_ts) / 86400 ))
          echo "Last commit on origin/main is ${age_days} day(s) old."
          if (( age_days < 30 )); then
            echo "Repository is active (<30 days since last commit) -- no heartbeat commit needed."
            exit 0
          fi
          heartbeat_iso=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "${heartbeat_iso}" > ".github/last-heartbeat"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".github/last-heartbeat"
          git commit -m "chore: heartbeat commit to keep scheduled workflows enabled [skip ci]"
          git push origin HEAD:main

      - name: Job summary
        if: always()
        uses: ./.github/actions/turboedge-state-summary
        with:
          mode: weekly
          state_note: ${{ steps.state.outputs.state_note }}

      - name: Pack and upload state
        if: success()
        uses: ./.github/actions/turboedge-state-pack
        with:
          state_key: ${{ secrets.TURBOEDGE_STATE_KEY }}

      # A second copy of the SAME lean shape (no state/snapshots/ -- see the
      # top-of-file comment on `turboedge-state-backup-enc`), uploaded under
      # a longer 90-day retention as a DuckDB/ledger/registry/trials restore
      # point that survives well past the fast-rotating lean chain's ~14-day
      # window. Deliberately NOT a Parquet backup: state/snapshots/ is kept
      # durable instead by every scan run's own incremental snapshot
      # artifact (see the scan job's "Pack incremental Parquet snapshot
      # artifact" step) -- packing the accumulated Parquet history here too
      # was the old approach, and it was broken (weekly never scans, so it
      # could only ever re-upload stale history, never anything written
      # after the scheme shipped; see state/archive.py's module docstring).
      # Nothing restores this automatically; it is a deliberate, manual
      # fallback (`gh run download` + `state unpack`) for an incident not
      # caught within 14 days.
      - name: Pack and upload state backup (longer retention)
        if: success()
        uses: ./.github/actions/turboedge-state-pack
        with:
          state_key: ${{ secrets.TURBOEDGE_STATE_KEY }}
          artifact_name: "turboedge-state-backup-enc"
          retention_days: "90"
          out_file: "state-backup.tar.enc"

  # ---------------------------------------------------------------------
  # monthly -- 1st of month: success report
  # ---------------------------------------------------------------------
  monthly:
    needs: resolve-mode
    if: needs.resolve-mode.outputs.mode == 'monthly'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore TurboEdge state
        id: state
        uses: ./.github/actions/turboedge-state
        with:
          state_key: ${{ secrets.TURBOEDGE_STATE_KEY }}
          mode: monthly
          allow_fresh_state: ${{ inputs.allow_fresh_state }}
          github_token: ${{ github.token }}

      - name: Run monthly report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TURBOEDGE_EMAIL_TO: ${{ secrets.TURBOEDGE_EMAIL_TO }}
        run: uv run turboedge --log-format json report monthly --email

      # Pre-registered trial 2026Q4-001 (docs/preregistration_2026Q4_001.md).
      # Runs in the monthly slot because that is the first scheduled job on or
      # after 2026-10-01, which the pre-registration fixes as the opening date.
      #
      # It is meant to run EXACTLY ONCE, and the command enforces that itself:
      # it refuses before --not-before, and refuses again once
      # docs/results_2026Q4_001.json exists. Both refusals exit non-zero, which
      # is why this step is continue-on-error -- every month after October will
      # legitimately refuse, and that must not fail the monthly job.
      #
      # The guard is not bureaucracy. What separates this from the retrospective
      # p=0.0135 in docs/measured_results.md §6.12 is that nobody chooses when
      # it runs or gets to run it again; a monthly job that repeated it would
      # turn one test into twelve.
      - name: Pre-registered trial 2026Q4-001 (runs once, refuses thereafter)
        continue-on-error: true
        run: uv run turboedge --log-format json research synthetic-ev --trial 2026Q4-001

      # 2026Q4-002 tests the WIDTH channel: each arm's path dispersion set to
      # its own forecast sigma, which simulate_paths only became able to
      # express on 2026-09-26. Same one-shot guards, own result file, own
      # opening date. Its Amendment A already found the premise in its own §2
      # to be backwards -- narrowing the distribution lowers P(KO) and makes
      # the payoff worse anyway, because a turbo is a convex claim -- so the
      # mechanical bias runs against the challenger, not for it.
      - name: Pre-registered trial 2026Q4-002 (runs once, refuses thereafter)
        continue-on-error: true
        run: uv run turboedge --log-format json research synthetic-ev --trial 2026Q4-002

      # The result file is committed so the trial's outcome is in version
      # control next to the frozen pre-registration that produced it, rather
      # than only in an artifact that expires.
      - name: Commit any synthetic-EV result just written
        continue-on-error: true
        run: |
          if ! git diff --quiet --exit-code docs/results_2026Q4_00*.json 2>/dev/null || [ -n "$(git ls-files --others --exclude-standard docs/results_2026Q4_00*.json)" ]; then
            git config user.name "turboedge-pipeline"
            git config user.email "noreply@github.com"
            git add docs/results_2026Q4_00*.json
            git commit -m "Result: pre-registered synthetic-EV trial"
            git push
          else
            echo "no new synthetic-EV result to commit"
          fi

      - name: Job summary
        if: always()
        uses: ./.github/actions/turboedge-state-summary
        with:
          mode: monthly
          state_note: ${{ steps.state.outputs.state_note }}

      - name: Pack and upload state
        if: success()
        uses: ./.github/actions/turboedge-state-pack
        with:
          state_key: ${{ secrets.TURBOEDGE_STATE_KEY }}
