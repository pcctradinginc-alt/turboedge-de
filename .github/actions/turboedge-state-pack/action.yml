name: "TurboEdge: pack and upload state"
description: >-
  Pack the state directory (`turboedge state pack`) and upload it as a
  workflow artifact. Every scan/eod/weekly/monthly job calls this with its
  defaults for the small, lean shape (state/snapshots/ -- the immutable
  per-run Parquet archive -- excluded); the weekly job additionally calls
  it a second time with `artifact_name`/`retention_days` overrides only
  (still the same lean shape) for a longer-retained DuckDB/ledger/registry/
  trials restore point. `include_snapshots` (below) is for a manual/ad hoc
  full export only -- no pipeline.yml job passes it; the accumulated
  Parquet history is instead kept durable via the scan job's own `state
  pack-snapshots` step, a separate mechanism from this action (see
  state/archive.py's module docstring, "Parquet archiving"). `actions/
  upload-artifact` is a normal action step and works fine inside a
  composite action -- the only composite-specific gotchas are that `run:`
  steps need their own `shell:` and that a step's `if:` can only see prior
  steps *within this composite*, not the calling job. Because of that
  second point, callers MUST gate the call to this action with
  `if: success()` (never `always()`) so a failed mode step never uploads a
  broken/incomplete state -- overwriting the artifact history with bad
  state would corrupt every future restore.

inputs:
  state_key:
    description: "Value of the TURBOEDGE_STATE_KEY repo secret."
    required: true
  include_snapshots:
    description: >-
      "true" to also pack state/snapshots/ (the immutable per-run Parquet
      archive) -- a manual/ad hoc full-export shape. Default "false": the
      lean shape (state/archive.py LEAN_INCLUDE_DIRS) every pipeline.yml
      job packs. No pipeline.yml job passes "true".
    required: false
    default: "false"
  artifact_name:
    description: "Name to upload the packed archive under."
    required: false
    default: "turboedge-state-enc"
  retention_days:
    description: >-
      Artifact retention, in days. The default (short) window is enough to
      cover the restore step's 50-successful-run fallback search for the
      fast-rotating lean package (several uploads/day, only the latest ever
      restored in the normal path); the weekly job's second call overrides
      this to 90 for its longer-retained backup copy.
    required: false
    default: "14"
  out_file:
    description: "Local filename for the packed archive before upload."
    required: false
    default: "state.tar.enc"
  push_to_backend:
    description: >-
      "true" to also push this archive to the optional durable state
      backend (`turboedge state backend put`, Phase H -- see
      docs/durable_state.md) after packing/uploading the GitHub Actions
      artifact above. The backend is entirely opt-in: if
      TURBOEDGE_STATE_BACKEND is unset (the default -- nothing configured),
      this step is skipped with a note rather than failing. If a backend
      IS configured and the push fails (bad credentials, unreachable
      endpoint, checksum verification failure, ...), this step -- and
      therefore the calling job -- fails loudly instead of silently
      continuing, so a broken durable backend is never silently ignored.
      The GitHub Actions artifact above is uploaded either way, unaffected
      by this step's outcome.
    required: false
    default: "false"
  backend_key:
    description: >-
      Logical key this archive is versioned under in the durable backend
      (turboedge.state.backend). Distinct backend_key values keep distinct
      archive streams (e.g. the routine lean archive vs. a longer-cadence
      backup) as separate, independently-listable version histories.
    required: false
    default: "lean"

runs:
  using: composite
  steps:
    - name: Pack state
      shell: bash
      env:
        TURBOEDGE_STATE_KEY: ${{ inputs.state_key }}
        INCLUDE_SNAPSHOTS: ${{ inputs.include_snapshots }}
        OUT_FILE: ${{ inputs.out_file }}
      run: |
        set -euo pipefail
        if [[ "${INCLUDE_SNAPSHOTS}" == "true" ]]; then
          uv run turboedge --state-dir ./state state pack --include-snapshots --out "${OUT_FILE}"
        else
          uv run turboedge --state-dir ./state state pack --out "${OUT_FILE}"
        fi

    - name: Upload encrypted state artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.out_file }}
        retention-days: ${{ inputs.retention_days }}

    # ------------------------------------------------------------------
    # Optional durable push (Phase H, "dauerhafte Lernhistorie"): the
    # GitHub Actions artifact above is bounded by `retention_days` (14 or
    # 90) -- this pushes the SAME already-encrypted bytes to a
    # user-configured backend (turboedge.state.backend) with no expiry of
    # its own, so years of forward-ledger/posterior/model-registry/trial
    # history survive well past any GitHub artifact retention window. Never
    # replaces the artifact upload above; TURBOEDGE_STATE_BACKEND/
    # TURBOEDGE_STATE_S3_* come from job-level env (pipeline.yml), sourced
    # from repo secrets -- never logged, never written to the repo. See
    # docs/durable_state.md.
    # ------------------------------------------------------------------
    - name: Push to durable state backend (optional)
      if: inputs.push_to_backend == 'true'
      shell: bash
      env:
        OUT_FILE: ${{ inputs.out_file }}
        BACKEND_KEY: ${{ inputs.backend_key }}
      run: |
        set -euo pipefail
        if [[ -z "${TURBOEDGE_STATE_BACKEND:-}" ]]; then
          echo "TURBOEDGE_STATE_BACKEND is not set -- no durable backend configured, skipping " \
               "the durable push (the GitHub Actions artifact above still covers the normal " \
               "retention window; see docs/durable_state.md to opt in)."
          exit 0
        fi
        uv run turboedge --state-dir ./state state backend put --key "${BACKEND_KEY}" --in "${OUT_FILE}"
