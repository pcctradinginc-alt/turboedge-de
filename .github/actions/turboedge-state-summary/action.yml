name: "TurboEdge: job summary"
description: >-
  Write the "## Pipeline summary -- mode: <mode>" section (an optional
  state-restore note, plus the counts table from reports/summary.json) to
  GITHUB_STEP_SUMMARY. Call this with `if: always()` at the call site so it
  still reports even when the mode-specific step(s) failed.

inputs:
  mode:
    description: "Pipeline mode (scan/eod/weekly/monthly) for the summary heading."
    required: true
  state_note:
    description: "Optional note from the turboedge-state action's `state_note` output; rendered as a callout when non-empty."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Job summary
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        STATE_NOTE: ${{ inputs.state_note }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        import os

        mode = os.environ.get("MODE", "unknown")
        state_note = os.environ.get("STATE_NOTE", "")
        path = "reports/summary.json"
        summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
        lines = [f"## Pipeline summary -- mode: {mode}", ""]

        if state_note:
            lines.append(f"> **State restore:** {state_note}")
            lines.append("")

        try:
            with open(path, encoding="utf-8") as f:
                data = json.load(f)
        except FileNotFoundError:
            lines.append(f"No summary found at `{path}`.")
            data = None
        except (OSError, json.JSONDecodeError) as exc:
            lines.append(f"Could not read/parse `{path}`: {exc}")
            data = None

        if data is not None:
            counts = data.get("counts") or {}
            if counts:
                lines.append("| Category | Count |")
                lines.append("| --- | --- |")
                for category in sorted(counts):
                    lines.append(f"| {category} | {counts[category]} |")
            else:
                lines.append("No counts reported.")

            # `warnings` was reaching reports/summary.json and going no
            # further: this action rendered `counts` only, and the report
            # mail that also carries them is gated on `send_on`
            # (configs/gmail.yaml), which is ACTIONABLE-only -- and
            # ACTIONABLE is structurally 0 today. So a run that warned
            # about itself looked, in the job summary and in the log,
            # exactly like one that had nothing to say.
            #
            # Measured on run 35659955585 (2026-09-21, 23:55 CEST): DAX
            # raised `no_tradable_quotes_market_likely_closed` --
            # 9,888 of 10,022 candidates (98.7%) rejected on quote
            # freshness alone -- and no human-visible output mentioned it.
            # Both freshness gates fired on the same products, WATCH was 0,
            # and the summary showed only "ACTIONABLE 0 / REJECT 16054",
            # which reads as a market verdict rather than a closed market.
            #
            # Cheap here specifically: this step already prints its text to
            # stdout as well as GITHUB_STEP_SUMMARY, so one block makes
            # warnings visible in the Actions log and the run summary at
            # once -- no new plumbing, no second place to keep in sync.
            warnings = data.get("warnings") or []
            if warnings:
                lines.append("")
                lines.append(f"**Warnings ({len(warnings)}):**")
                for warning in warnings:
                    lines.append(f"- `{warning}`")

        text = "\n".join(lines) + "\n"
        print(text)
        if summary_path:
            with open(summary_path, "a", encoding="utf-8") as f:
                f.write(text)
        PY
