    forecast_series: true
    notes: >-
      NOT verified against data. Marked forecast_series: it describes a
      period that has not happened, so its availability is anchored to when
      TurboEdge obtains it, never to the period it predicts.

  # ==== U.S. EIA ======================================================
  # EIA_API_KEY is set as a repository secret, so unlike the other
  # credentialed sources this one can actually run -- but only in CI, where
  # the secret lives. It is not in this environment, so NONE of the three
  # series below could be confirmed against the live API.
  #
  # They are documented EIA v2 route/facet combinations, not invented ones,
  # and they are deliberately configured rather than withheld: a source with
  # zero series is skipped forever with "no series configured", which reads
  # like a decision when it is really an omission. The first CI run *is* the
  # verification. If a facet is wrong the payload comes back without the
  # column, the adapter reports `missing_series`, and readiness shows
  # BLOCKED with the reason -- which is exactly what that machinery is for.
  #
  # Only three, and only the ones with a defensible channel to the four
  # traded underlyings: oil prices reach EUR/USD and XAU through the dollar
  # and through inflation expectations. US petroleum inventories are the
  # supply-side counterpart. Electricity and gas routes exist in the
  # adapter's SUGGESTED_ROUTES but are not configured -- their channel to a
  # German turbo is not one I can argue for.
  - source: eia
    series_id: EIA.WTI_SPOT
    name: "Crude oil spot price, WTI Cushing"
    category: energy
    unit: usd_per_barrel
    frequency: daily
    native_identifier: "petroleum/pri/spt|series=RWTC|value"
    availability_precision: CONSERVATIVE_DATE
    backfill_class: HISTORICAL_CONSERVATIVE
    conservative_release_lag_hours: 96
    notes: >-
      NOT verified live -- no EIA_API_KEY in the authoring environment. The
      first CI run confirms or refutes the facet. A 96-hour lag: EIA spot
      prices carry a multi-day publication delay.

  - source: eia
    series_id: EIA.BRENT_SPOT
    name: "Crude oil spot price, Brent Europe"
    category: energy
    unit: usd_per_barrel
    frequency: daily
    native_identifier: "petroleum/pri/spt|series=RBRTE|value"
    availability_precision: CONSERVATIVE_DATE
    backfill_class: HISTORICAL_CONSERVATIVE
    conservative_release_lag_hours: 96
