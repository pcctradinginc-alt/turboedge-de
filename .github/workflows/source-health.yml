name: Source Health Check

on:
  schedule:
    # Mo–Fri 06:15 UTC (European morning)
    - cron: "15 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run source health check
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TURBOEDGE_EMAIL_TO: ${{ secrets.TURBOEDGE_EMAIL_TO }}
        run: uv run turboedge --log-format json sources health --json-out reports/source_health.json --email-on-fail

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-report
          path: reports/
          retention-days: 14
