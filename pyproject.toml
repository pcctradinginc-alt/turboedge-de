[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turboedge-de"
version = "0.1.0"
description = "TurboEdge-DE - research-only turbo/knockout certificate scanner and cost-analysis engine. No live trading, no broker API, no order execution."
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "TurboEdge-DE" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "polars>=1.9",
  "duckdb>=1.1",
  "pyarrow>=17.0",
  "pandas>=2.2",
  "httpx>=0.27",
  "tenacity>=8.5",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
  "structlog>=24.1",
  "yfinance>=0.2.40",
  "scikit-learn>=1.5",
  "cryptography>=43",
]

[project.scripts]
turboedge = "turboedge.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "pandas-stubs>=2.2",
  "respx>=0.21",
]
state-remote = [
  # Optional S3-compatible durable state backend (Phase H) --
  # turboedge.state.backend_s3. Works with AWS S3 and any S3-compatible
  # store (Cloudflare R2, Backblaze B2, Wasabi, MinIO, ...) via
  # endpoint_url; only imported when TURBOEDGE_STATE_BACKEND=s3.
  "boto3>=1.34",
]
research = [
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "statsmodels>=0.14",
  "river>=0.21",
  "arch>=7.0",
  "ruptures>=1.1",
  "plotly>=5.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/turboedge"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["turboedge"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF018"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "duckdb.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
  "live: tests that require real network access; excluded by default",
  # Deliberately NOT in `addopts`: this runs by default, in CI included.
  # The only test carrying it is ranking/test_ev.py's W7 performance proxy
  # (7.7s, vs 0.03s for the next-slowest test in that file) -- a runtime
  # assertion is worthless if the suite quietly stops running it. The
  # marker exists so a local `-m "not slow"` is possible during iteration,
  # and so pytest stops reporting it as a possible typo (an unregistered
  # mark means a real typo would be swallowed just as silently).
  "slow: measurably slower tests (seconds, not milliseconds); still run by default",
]

[tool.coverage.run]
source = ["turboedge"]
