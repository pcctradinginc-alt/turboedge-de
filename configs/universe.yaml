# TurboEdge-DE underlying universe (Master Spec Section 4).
# `enabled: true` underlyings are in scope for `turboedge universe` / `scan`
# in this milestone; the rest are declared for forward compatibility but
# skipped. Metadata here must stay consistent with
# src/turboedge/universe/underlying_map.py (covered by
# tests/universe/test_underlying_map.py).

underlyings:
