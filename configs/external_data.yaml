    name: "German electricity load, day-ahead forecast"
    category: energy
    unit: mw
    frequency: daily
    native_identifier: "v2/public_power_forecast|country=de,forecast_type=day-ahead,production_type=load|load"
    availability_precision: CONSERVATIVE_DATE
    backfill_class: FORWARD_ONLY
    conservative_release_lag_hours: 36
    forecast_series: true
    notes: >-
      Verified live 2026-09-28: 192 points covering today and tomorrow. The
      counterpart to EC.LOAD_DE. Their difference is the grid operators'
      forecast error -- an unplanned deviation, not a level.

