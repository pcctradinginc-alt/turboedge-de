name: Scan Report

on:
  schedule:
    # Mo–Fri 13:45 UTC (EU/US market overlap)
    - cron: "45 13 * * 1-5"
  workflow_dispatch:
    inputs:
      underlying:
        description: "Underlying to scan (e.g., DAX)"
        required: false
        default: "DAX"
        type: string
      top:
        description: "Number of top candidates to return"
        required: false
        default: "20"
        type: string
      email:
        description: "Send email report on completion"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: turboedge-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Create directories
        run: mkdir -p reports state

      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: state/
          key: turboedge-state-${{ github.run_id }}
          restore-keys: |
            turboedge-state-

      - name: Determine scan parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_UNDERLYING: ${{ inputs.underlying }}
          IN_TOP: ${{ inputs.top }}
          IN_EMAIL: ${{ inputs.email }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            underlying="DAX"; top="20"; send_email="false"
          else
            underlying="${IN_UNDERLYING:-DAX}"; top="${IN_TOP:-20}"; send_email="${IN_EMAIL:-false}"
          fi
          # Whitelist-validate inputs before they reach any shell command.
          [[ "$underlying" =~ ^[A-Za-z0-9_]{1,20}$ ]] || { echo "::error::invalid underlying"; exit 2; }
          [[ "$top" =~ ^[0-9]{1,3}$ ]] || { echo "::error::invalid top"; exit 2; }
          {
            echo "underlying=$underlying"
            echo "top=$top"
            echo "send_email=$send_email"
          } >> "$GITHUB_OUTPUT"

      - name: Run scan
        env:
          UNDERLYING: ${{ steps.params.outputs.underlying }}
          TOP: ${{ steps.params.outputs.top }}
          SEND_EMAIL: ${{ steps.params.outputs.send_email }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TURBOEDGE_EMAIL_TO: ${{ secrets.TURBOEDGE_EMAIL_TO }}
        run: |
          args=(--underlying "$UNDERLYING" --top "$TOP" --report-out reports/scan.txt --json-out reports/scan.json)
          if [[ "$SEND_EMAIL" == "true" ]]; then
            args+=(--email)
          fi
          uv run turboedge --log-format json scan "${args[@]}"

      - name: Summarize scan results
        if: always()
        env:
          SCAN_JSON_PATH: reports/scan.json
        run: |
          python3 - <<'PY'
          import json
          import os

          path = os.environ.get("SCAN_JSON_PATH", "reports/scan.json")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          lines = ["## Scan Summary", ""]
          data = None
          try:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
          except FileNotFoundError:
              lines.append(f"No scan report found at `{path}` (scan may not have produced one).")
          except (OSError, json.JSONDecodeError) as exc:
              lines.append(f"Could not read/parse `{path}`: {exc}")

          if data is not None:
              lines.append(f"Run ID: `{data.get('run_id', 'n/a')}`")

              error = data.get("error")
              if error:
                  lines.append(f"\n**Error:** {error}")

              counts = data.get("counts") or {}
              if counts:
                  lines.append("")
                  lines.append("| Category | Count |")
                  lines.append("| --- | --- |")
                  for category in sorted(counts):
                      lines.append(f"| {category} | {counts[category]} |")
              else:
                  lines.append("")
                  lines.append("No candidate counts available.")

              warnings = data.get("warnings") or []
              if warnings:
                  lines.append("")
                  lines.append("### Warnings")
                  shown = warnings[:20]
                  for warning in shown:
                      lines.append(f"- {warning}")
                  remaining = len(warnings) - len(shown)
                  if remaining > 0:
                      lines.append(f"- ... and {remaining} more")

          text = "\n".join(lines) + "\n"
          print(text)
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(text)
          PY

      - name: Display database info
        run: uv run turboedge db info

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/
          key: turboedge-state-${{ github.run_id }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report-${{ github.run_id }}
          path: reports/
          retention-days: 30
