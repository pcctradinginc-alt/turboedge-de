name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (with dev extras)
        run: uv sync --extra dev --locked

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Format check with ruff
        run: uv run ruff format --check .

      - name: Type check with mypy
        run: uv run mypy src

      # `-n auto` measured on this suite 2026-10-23, with coverage, on a
      # 10-core machine: 257.7s serial -> 92.7s parallel, a 2.78x speedup
      # with identical results (2357 passed, 1 skipped, 3 xfailed both
      # ways). Three consecutive parallel runs without coverage were 54.8 /
      # 56.1 / 57.9s, so the gain is reproducible rather than one lucky
      # scheduling. GitHub's standard runners have fewer cores than the
      # machine this was measured on, so expect less there -- `auto` adapts
      # rather than hard-coding a worker count.
      #
      # This touches only the test workflow. It cannot affect data
      # collection: pipeline.yml is a separate workflow and is unchanged.
      #
      # Threads pinned to one per worker. numpy's Linux wheels ship OpenBLAS
      # with a pthreads pool sized to the core count, and scikit-learn adds
      # OpenMP, so four xdist workers on a four-core runner can ask for
      # sixteen compute threads. Measured consequence on run 39995755648:
      # `test_fit_predict_runtime_under_5s_on_4000_bars[logit]` took 9.12s
      # against a 5s budget, where the same test takes a reproducible 0.38s
      # serially -- a 24x inflation, which is contention, not variance.
      # xdist already gives each worker one core's worth of work; letting
      # each one also fan out across all cores only makes them fight.
      - name: Run tests with pytest
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          NUMEXPR_NUM_THREADS: 1
          VECLIB_MAXIMUM_THREADS: 1
        run: uv run pytest -q -n auto --cov=turboedge --cov-report=term-missing
