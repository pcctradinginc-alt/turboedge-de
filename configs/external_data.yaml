# TurboEdge-DE External Data Factory -- curated source and series catalog.
#
# Every series here is a deliberate choice, not a bulk download (spec §9).
# An entry may only be added after its identifier has been VERIFIED against
# the publisher's live API. Identifiers are never guessed: a wrong series key
# that happens to return numbers is the worst possible failure, because it
# produces a plausible dataset describing something else entirely.
#
# `enabled: false` sources are never fetched. A source is enabled only once
# its licence reference, credential requirement and point-in-time class have
# been written down and its status is not one of AUTH_MISSING /
# REVIEW_REQUIRED / BLOCKED / DEFERRED.

readiness_policy_version: "1"
max_missingness: 0.10
max_staleness_days: 45
# A monthly series is never fresher than about a month, so the staleness
# limit scales with the series' own cadence rather than being a flat day
# count. Measured live 2026-09-28: a flat 45 days wrongly marked ECB.M3
# (58 days) and ECB.MIR_HH_LENDING (89 days) DEGRADED while both were
# publishing perfectly normally.
max_staleness_periods: 2.5
# A monthly series is never fresher than about a month, so the staleness
# limit scales with the series' own cadence rather than being a flat day
# count. Measured 2026-09-28: a flat 45 days wrongly marked ECB.M3 and
# ECB.MIR_HH_LENDING as DEGRADED while both were publishing normally.
max_staleness_periods: 2.5
require_strict_pit_for_confirmation: true

# Conservative initial defaults from spec §35. NOT empirically optimised and
# never to be tuned against returns (spec §55). Overriding one requires a
# documented methodological reason, recorded here in a comment.
readiness_profiles:
  daily:
    min_exploratory_observations: 180
    min_exploratory_span_days: 270
    min_validation_observations: 60
    min_confirmation_observations: 60
    min_forward_span_days: 90
  business_daily:
    min_exploratory_observations: 180
    min_exploratory_span_days: 270
    min_validation_observations: 60
    min_confirmation_observations: 60
    min_forward_span_days: 90
  weekly:
    min_exploratory_observations: 52
    min_exploratory_span_days: 365
    min_validation_observations: 20
    min_confirmation_observations: 20
    min_forward_span_days: 140
  monthly:
    min_exploratory_observations: 48
    min_exploratory_span_days: 1460
    min_validation_observations: 12
    min_confirmation_observations: 12
    min_forward_span_days: 365
  quarterly:
    min_exploratory_observations: 32
    min_exploratory_span_days: 2920
    min_validation_observations: 8
    min_confirmation_observations: 8
    min_forward_span_days: 730

sources:
  # --------------------------------------------------------------------
  # ECB Data Portal -- verified live 2026-09-28, six series returned HTTP
  # 200 with SDMX-JSON. No credential, no anti-bot obstacle.
  # Vintages are NOT exposed: the API serves the current revision only, so
  # history is revised in place and cannot serve as strict PIT evidence.
  # --------------------------------------------------------------------
  ecb:
    source_id: ecb
    display_name: "ECB Data Portal"
    official_source: "European Central Bank"
    homepage: "https://data.ecb.europa.eu/"
    machine_endpoint: "https://data-api.ecb.europa.eu/service/data"
    access_method: "REST / SDMX-JSON"
    requires_auth: false
    license_or_terms_reference: "https://www.ecb.europa.eu/services/disclaimer/html/index.en.html"
    commercial_use_status: "PERMITTED_WITH_ATTRIBUTION"
    frequency: "mixed"
    expected_update_cadence: "daily to monthly, series dependent"
    supports_historical_data: true
    supports_vintages: false
    supports_exact_release_time: false
    point_in_time_quality: CONSERVATIVE_DATE
    backfill_class: HISTORICAL_CONSERVATIVE
    enabled: true
    criticality: IMPORTANT
    status: PASS
    status_note: >-
      Endpoint and all six series verified live 2026-09-28. Terms read
      2026-09-28: free use of information obtained from the site provided the
      ECB is cited as the source and any alterations are stated. The written
      authorisation requirement applies to authored works (e.g. Working
      Papers), not to statistical series. Attribution: "Source: European
      Central Bank".

  # --------------------------------------------------------------------
  # Deutsche Bundesbank -- verified live 2026-09-28. NOTE: the API returns
  # HTTP 406 for SDMX-JSON; only `Accept: text/csv` is accepted.
  # --------------------------------------------------------------------
  bundesbank:
    source_id: bundesbank
    display_name: "Deutsche Bundesbank Zeitreihen-Datenbanken"
    official_source: "Deutsche Bundesbank"
    homepage: "https://www.bundesbank.de/de/statistiken/zeitreihen-datenbanken"
    machine_endpoint: "https://api.statistiken.bundesbank.de/rest/data"
    access_method: "REST / SDMX, text/csv only"
    requires_auth: false
    license_or_terms_reference: "https://www.bundesbank.de/de/startseite/benutzerhinweise/nutzungsbedingungen-fuer-den-allgemeinen-gebrauch-der-website-763554"
    commercial_use_status: "PERMITTED_WITH_ATTRIBUTION"
    frequency: "mixed"
    expected_update_cadence: "daily to monthly, series dependent"
    supports_historical_data: true
    supports_vintages: false
    supports_exact_release_time: false
    point_in_time_quality: CONSERVATIVE_DATE
    backfill_class: HISTORICAL_CONSERVATIVE
    enabled: true
    criticality: IMPORTANT
    status: PASS
    status_note: >-
      Endpoint verified live 2026-09-28 (Accept: text/csv required, otherwise
      HTTP 406). Terms read 2026-09-28: self-created information may be
      stored, shared and reproduced for personal or business use citing
      "Quelle: Deutsche Bundesbank". The explicit commercial prohibition on
      that page concerns images and videos, not statistical series.

  # --------------------------------------------------------------------
  # FRED / ALFRED -- the only Wave 1 source with genuine vintages, which is
  # what makes its history point-in-time safe rather than merely long.
  # Cannot be verified here: no API key is present in this environment.
  # --------------------------------------------------------------------
  fred:
    source_id: fred
    display_name: "FRED / ALFRED (Federal Reserve Bank of St. Louis)"
    official_source: "Federal Reserve Bank of St. Louis"
    homepage: "https://fred.stlouisfed.org/"
    machine_endpoint: "https://api.stlouisfed.org/fred"
    access_method: "REST / JSON, API key"
    requires_auth: true
    auth_environment_variable: "FRED_API_KEY"
    license_or_terms_reference: "https://fred.stlouisfed.org/legal/"
    commercial_use_status: "REVIEW_REQUIRED"
    frequency: "mixed"
    expected_update_cadence: "series dependent, release-calendar driven"
    supports_historical_data: true
    supports_vintages: true
    supports_exact_release_time: false
    point_in_time_quality: EXACT_DATE
    backfill_class: HISTORICAL_PIT_SAFE
    enabled: true
    criticality: IMPORTANT
    status: PASS
    status_note: >-
      FRED_API_KEY set as a repository secret 2026-09-28, so this runs in
      CI. Not present in the authoring environment, so the eleven series
      could not be confirmed live -- the first CI run is the verification.
      This is the only source whose history can carry a confirmatory test:
      ALFRED records what was actually knowable on each historical day
      instead of assuming it.

  # --------------------------------------------------------------------
  # EU Business & Consumer Surveys, disseminated through the Eurostat API.
  # Verified live 2026-09-28: ei_bssi_m_r2 and ei_bsco_m both HTTP 200
  # (JSON-stat 2.0). Revised in place, no vintages.
  # --------------------------------------------------------------------
  eu_bcs:
    source_id: eu_bcs
    display_name: "European Commission Business & Consumer Surveys"
    official_source: "European Commission DG ECFIN / Eurostat dissemination"
    homepage: "https://economy-finance.ec.europa.eu/economic-forecast-and-surveys/business-and-consumer-surveys_en"
    machine_endpoint: "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data"
    access_method: "REST / JSON-stat 2.0"
    requires_auth: false
    license_or_terms_reference: "https://ec.europa.eu/eurostat/web/main/help/copyright-notice"
    commercial_use_status: "PERMITTED_WITH_ATTRIBUTION"
    frequency: "monthly"
    expected_update_cadence: "monthly, near month end"
    supports_historical_data: true
    supports_vintages: false
    supports_exact_release_time: false
    point_in_time_quality: CONSERVATIVE_DATE
    backfill_class: HISTORICAL_CONSERVATIVE
    enabled: true
    criticality: EXPERIMENTAL
    status: PASS
    status_note: >-
      Datasets verified live 2026-09-28. Terms read 2026-09-28 (Commission
      Decision of 12 December 2011, 2011/833/EU): reuse of statistical data
      for commercial or non-commercial purposes is authorised provided the
      source is acknowledged and changes are indicated. The listed exceptions
      concern non-EU/EFTA and certain trade data, not EU survey indicators.

  # --------------------------------------------------------------------
  # Destatis daily truck-toll mileage index. Verified live 2026-09-28: the
  # statistical report downloads as XLSX (~950 KB, HTTP 200).
  # robots.txt sets Crawl-delay: 30 -- honoured, not worked around.
  # Historical release timing is NOT reconstructable, so the history is not
  # strict PIT evidence and forward archival starts now (spec §12E).
  # --------------------------------------------------------------------
  destatis_truck:
    source_id: destatis_truck
    display_name: "Destatis täglicher Lkw-Maut-Fahrleistungsindex"
    official_source: "Statistisches Bundesamt (Destatis)"
    homepage: "https://www.destatis.de/DE/Themen/Branchen-Unternehmen/Industrie-Verarbeitendes-Gewerbe/Tabellen/Lkw-Maut-Fahrleistungsindex-Daten.html"
    machine_endpoint: "https://www.destatis.de/DE/Themen/Branchen-Unternehmen/Industrie-Verarbeitendes-Gewerbe/Publikationen/Downloads-Konjunktur"
    access_method: "HTTPS file download (XLSX)"
    requires_auth: false
    license_or_terms_reference: "https://www.destatis.de/EN/Service/Legal-Notice/CopyrightGeneral.html"
    commercial_use_status: "PERMITTED_WITH_ATTRIBUTION"
    frequency: "daily"
    expected_update_cadence: "weekly, Thursdays"
    supports_historical_data: true
    supports_vintages: false
    supports_exact_release_time: false
    point_in_time_quality: UNKNOWN
    backfill_class: FORWARD_ONLY
    enabled: true
    criticality: IMPORTANT
    status: PASS
    status_note: >-
      File verified live 2026-09-28 (XLSX, ~950 KB). Terms read 2026-09-28:
      reproduction and distribution permitted with source citation
      "Statistisches Bundesamt (Destatis)", commercial use unrestricted,
      modifications must be identified. robots.txt sets Crawl-delay: 30,
      which the adapter honours. Historical release timing is unrecoverable
      from the file, hence FORWARD_ONLY: only snapshots TurboEdge takes
      itself count as point-in-time evidence.

  # --------------------------------------------------------------------
  # Japan e-Stat. NOT part of the written specification -- added on the
  # user's direct instruction, who holds an API key to be added as a secret.
  # --------------------------------------------------------------------
  estat:
    source_id: estat
    display_name: "e-Stat (Portal Site of Official Statistics of Japan)"
    official_source: "Statistics Bureau of Japan / e-Stat"
    homepage: "https://www.e-stat.go.jp/"
    machine_endpoint: "https://api.e-stat.go.jp/rest/3.0/app/json"
    access_method: "REST / JSON, application ID"
    requires_auth: true
    auth_environment_variable: "ESTAT_APP_ID"
    license_or_terms_reference: "https://www.e-stat.go.jp/api/api-info/api-terms"
    commercial_use_status: "REVIEW_REQUIRED"
    frequency: "mixed"
    expected_update_cadence: "series dependent"
    supports_historical_data: true
    supports_vintages: false
    supports_exact_release_time: false
    point_in_time_quality: CONSERVATIVE_DATE
    backfill_class: HISTORICAL_CONSERVATIVE
    enabled: true
    criticality: EXPERIMENTAL
    status: PASS
    status_note: >-
      ESTAT_APP_ID set as a repository secret 2026-09-28; activated on the
      user's instruction. Three CPI series configured, all of them narrowed
      by cd* filters taken from e-Stat's own official code list -- an
      e-Stat table is not a series, and an unfiltered fetch of 0003427113
      would write an uncontrolled number of them from one request.

  # ====================================================================
  # WAVE 2. Registered 2026-09-28. Every endpoint below was probed live
  # before it was written down; what could not be established is recorded
  # as unresolved rather than assumed.
  #
  # NONE of these is enabled yet, for two distinct reasons that must not
  # be conflated:
  #   * agsi / alsi / eia / entsoe -- no credential present (AUTH_MISSING).
  #   * portwatch / kiel_trade -- endpoints work without a key, but their
  #     reuse terms could not be read (REVIEW_REQUIRED). Spec §8: do not
  #     guess licensing.
  # ====================================================================

  # IMF PortWatch. Works with no credential -- verified live 2026-09-28,
  # 28 chokepoints, daily, current to 2026-09-20 (Suez Canal n_cargo=23).
  # The ArcGIS item's own metadata declares its licence reference as
  # https://www.imf.org/external/terms.htm, and that page answers HTTP 403
  # to a non-browser user agent (Akamai). Not bypassed. A human can read
  # it in a browser in under a minute; until then this stays disabled.
  portwatch:
    source_id: portwatch
    display_name: "IMF PortWatch"
    official_source: "International Monetary Fund"
    homepage: "https://portwatch.imf.org/"
    machine_endpoint: "https://services9.arcgis.com/weJ1QsnbMYJlCHdG/arcgis/rest/services"
    access_method: "ArcGIS FeatureServer REST / JSON"
    requires_auth: false
    license_or_terms_reference: "https://www.imf.org/external/terms.htm"
    commercial_use_status: "CLEARED_BY_OPERATOR"
    frequency: "daily"
    expected_update_cadence: "daily, roughly one week behind"
    supports_historical_data: true
    supports_vintages: false
    supports_exact_release_time: false
    point_in_time_quality: UNKNOWN
    backfill_class: FORWARD_ONLY
    enabled: true
    criticality: EXPERIMENTAL
    status: PASS
    status_note: >-
      Endpoint and data verified live 2026-09-28, no credential needed.
      Enabled 2026-09-28 on the repository operator's explicit instruction
      ("Port Watch geht ohne Lizenz").

      What that does and does not mean, stated plainly because the
      distinction matters if anyone reads this later: the licence was NOT
      verified by this system. The ArcGIS item's own metadata names
      https://www.imf.org/external/terms.htm as its licence reference, and
      that page answers HTTP 403 to a non-browser user agent (Akamai). It
      was not circumvented, and no other machine-readable statement of the
      terms exists in the item metadata. The basis for ingesting is the
      operator's judgement, not a reading this system performed.

      portwatch.imf.org declares Crawl-delay: 60, which the adapter honours
      even though the data is served from Esri infrastructure.

  # Kiel Trade Indicator. Works with no credential -- verified live
  # 2026-09-28. Only two of the thirteen published CSVs are still being
  # maintained; the rest are frozen at January 2025 and two 404. No licence
  # statement exists on the indicator's own page or the download gallery.
  kiel_trade:
    source_id: kiel_trade
    display_name: "Kiel Trade Indicator"
    official_source: "Kiel Institute for the World Economy (IfW Kiel)"
    homepage: "https://www.kielinstitut.de/topics/international-trade/kiel-trade-indicator/"
    machine_endpoint: "https://trade.kielinstitut.de/KTI"
    access_method: "HTTPS CSV download"
    requires_auth: false
    license_or_terms_reference: "https://www.kielinstitut.de/en/legal-notice/"
    commercial_use_status: "REVIEW_REQUIRED"
    frequency: "daily"
    expected_update_cadence: "daily for the maintained series; monthly around the 5th for the indicator itself"
    supports_historical_data: true
    supports_vintages: false
    supports_exact_release_time: false
    point_in_time_quality: UNKNOWN
    backfill_class: FORWARD_ONLY
    enabled: false
    criticality: EXPERIMENTAL
    status: REVIEW_REQUIRED
    status_note: >-
      Files verified live 2026-09-28. Neither the indicator page nor the
      download gallery states any licence, so terms are unresolved. Note
      that most published CSVs are stale: only the Red Sea and Cape of Good
      Hope ship counts were current (2026-09-25 / 2026-09-24); eight others
      stop in January 2025 and two return HTTP 404.

  # Energy-Charts (Fraunhofer ISE). The only Wave 2 source that can go live
  # immediately: no credential, and the licence travels in every response
  # body ("CC BY 4.0 ... from Bundesnetzagentur | SMARD.de"), so there is
  # nothing left at REVIEW_REQUIRED. Verified live 2026-09-28.
  #
  # A SECONDARY source: Fraunhofer re-serves ENTSO-E and Bundesnetzagentur
  # data. One more hop that can break, and undocumented revision behaviour,
  # hence HISTORICAL_CONSERVATIVE rather than PIT-safe. When the ENTSO-E
  # token arrives, running both gives a cross-source check on the same
  # published quantity -- the same reason BBK.EURUSD_REF duplicates
  # ECB.EURUSD.
  #
  # Note: the response carries `generated_at`, which is NOT a publication
  # timestamp. Measured 2026-09-28: identical across two calls two seconds
  # apart (server cache), then equal to the new request time two minutes
  # later. It is response-generation time, so availability stays
  # CONSERVATIVE_DATE.
  energy_charts:
    source_id: energy_charts
    display_name: "Energy-Charts (Fraunhofer ISE)"
    official_source: "Fraunhofer Institute for Solar Energy Systems ISE"
    homepage: "https://energy-charts.info/"
    machine_endpoint: "https://api.energy-charts.info"
    access_method: "REST / JSON v2, no credential"
    requires_auth: false
    license_or_terms_reference: "https://creativecommons.org/licenses/by/4.0/"
    commercial_use_status: "PERMITTED_WITH_ATTRIBUTION"
    frequency: "daily"
    expected_update_cadence: "intraday, PT15M resolution"
    supports_historical_data: true
    supports_vintages: false
    supports_exact_release_time: false
    point_in_time_quality: CONSERVATIVE_DATE
    backfill_class: HISTORICAL_CONSERVATIVE
    enabled: true
    criticality: EXPERIMENTAL
    status: PASS
    status_note: >-
      Verified live 2026-09-28. Licence declared in every response body as
      CC BY 4.0 with attribution to energy-charts.info / Bundesnetzagentur /
      SMARD.de; the adapter re-checks it on every parse and warns if it
      changes. Attribution: "Data: Energy-Charts (Fraunhofer ISE), CC BY 4.0".

  # Gas Infrastructure Europe. One key (GIE_API_KEY) covers both datasets.
  # CRITICAL, verified live 2026-09-28: both answer HTTP 200 for a missing
  # key and report the failure only in the body ("Invalid or missing API
  # key"), so a status-code-only check would read an auth failure as a
  # legitimately empty day.
  agsi:
    source_id: agsi
    display_name: "GIE AGSI (European gas storage)"
    official_source: "Gas Infrastructure Europe"
    homepage: "https://agsi.gie.eu/"
    machine_endpoint: "https://agsi.gie.eu/api"
    access_method: "REST / JSON, x-key header"
    requires_auth: true
    auth_environment_variable: "GIE_API_KEY"
    license_or_terms_reference: "https://www.gie.eu/transparency-platform/GIE_API_documentation/"
    commercial_use_status: "REVIEW_REQUIRED"
    frequency: "daily"
    expected_update_cadence: "daily, gas-day based"
    supports_historical_data: true
    supports_vintages: false
    supports_exact_release_time: false
    point_in_time_quality: CONSERVATIVE_DATE
    backfill_class: HISTORICAL_CONSERVATIVE
    enabled: true
    criticality: EXPERIMENTAL
    status: PASS
    status_note: >-
      GIE_API_KEY set as a repository secret 2026-09-28; one key covers
      AGSI and ALSI. Runs in CI only -- not present in the authoring
      environment, so the three series are unconfirmed until the first run.
      The key travels in the x-key header and is never persisted.

  alsi:
    source_id: alsi
    display_name: "GIE ALSI (European LNG terminals)"
    official_source: "Gas Infrastructure Europe"
    homepage: "https://alsi.gie.eu/"
    machine_endpoint: "https://alsi.gie.eu/api"
    access_method: "REST / JSON, x-key header"
    requires_auth: true
    auth_environment_variable: "GIE_API_KEY"
    license_or_terms_reference: "https://www.gie.eu/transparency-platform/GIE_API_documentation/"
    commercial_use_status: "REVIEW_REQUIRED"
    frequency: "daily"
    expected_update_cadence: "daily, gas-day based"
    supports_historical_data: true
    supports_vintages: false
    supports_exact_release_time: false
    point_in_time_quality: CONSERVATIVE_DATE
    backfill_class: HISTORICAL_CONSERVATIVE
    enabled: true
    criticality: EXPERIMENTAL
    status: PASS
    status_note: >-
      Shares GIE_API_KEY with AGSI, set 2026-09-28. Runs in CI; the two
      series are unconfirmed until the first authenticated run.

  # U.S. EIA Open Data v2. Verified live 2026-09-28 without a key:
  # HTTP 403 with {"error":{"code":"API_KEY_MISSING", ...}} -- an honest,
  # unambiguous failure, unlike GIE's.
  eia:
    source_id: eia
    display_name: "U.S. Energy Information Administration Open Data v2"
    official_source: "U.S. Energy Information Administration"
    homepage: "https://www.eia.gov/opendata/"
    machine_endpoint: "https://api.eia.gov/v2"
    access_method: "REST / JSON, api_key query parameter"
    requires_auth: true
    auth_environment_variable: "EIA_API_KEY"
    license_or_terms_reference: "https://www.eia.gov/about/copyrights_reuse.php"
    commercial_use_status: "REVIEW_REQUIRED"
    frequency: "mixed"
    expected_update_cadence: "weekly to monthly, series dependent"
    supports_historical_data: true
    supports_vintages: false
    supports_exact_release_time: false
    point_in_time_quality: CONSERVATIVE_DATE
    backfill_class: HISTORICAL_CONSERVATIVE
    enabled: true
    criticality: EXPERIMENTAL
    status: PASS
    status_note: >-
      EIA_API_KEY is set as a repository secret (2026-09-28), so this runs
      in CI. It is not present in the authoring environment, so the three
      configured series could not be confirmed live -- the first CI run is
      the verification, and a wrong facet surfaces as BLOCKED readiness
      rather than as silence. The key is a query parameter and is redacted
      before anything is archived.

  # ENTSO-E Transparency Platform. Verified live 2026-09-28 without a
  # token: HTTP 401 with an XML Acknowledgement_MarketDocument.
  entsoe:
    source_id: entsoe
    display_name: "ENTSO-E Transparency Platform"
    official_source: "European Network of Transmission System Operators for Electricity"
    homepage: "https://transparency.entsoe.eu/"
    machine_endpoint: "https://web-api.tp.entsoe.eu/api"
    access_method: "REST / SDMX-flavoured XML, securityToken"
    requires_auth: true
    auth_environment_variable: "ENTSOE_SECURITY_TOKEN"
    license_or_terms_reference: "https://transparency.entsoe.eu/content/static_content/Static%20content/terms%20and%20conditions/terms%20and%20conditions.html"
    commercial_use_status: "REVIEW_REQUIRED"
    frequency: "daily"
    expected_update_cadence: "intraday to daily, document-type dependent"
    supports_historical_data: true
    supports_vintages: false
    supports_exact_release_time: true
    point_in_time_quality: CONSERVATIVE_DATE
    backfill_class: HISTORICAL_CONSERVATIVE
    enabled: false
    criticality: EXPERIMENTAL
    status: AUTH_MISSING
    status_note: >-
      ENTSOE_SECURITY_TOKEN is not set. Free: register at
      transparency.entsoe.eu and request API access from the helpdesk.
      Note that ENTSO-E also returns an Acknowledgement document with HTTP
      200 for a no-data query, so the adapter checks the root element, not
      just the status code.

series:
  # ==== ECB, all six verified live 2026-09-28 =========================
  # A 36-hour conservative lag: these are published on the following
  # business morning, and erring late costs a little power while erring
  # early invents a forecast the system could not have made.
  - source: ecb
    series_id: ECB.MRO_RATE
    name: "ECB main refinancing operations rate"
    category: policy_rate
    unit: percent
    frequency: business_daily
    native_identifier: "FM/B.U2.EUR.4F.KR.MRR_FR.LEV"
    availability_precision: CONSERVATIVE_DATE
    backfill_class: HISTORICAL_CONSERVATIVE
    conservative_release_lag_hours: 36
    event_driven: true
    notes: >-
      Verified live 2026-09-28, HTTP 200. The ECB publishes only the change
      points: 48 observations since 1999, one per decision that moved the
      rate. Declaring this business_daily made it look 99.3% incomplete when
      it is in fact complete -- measured on the first live run.

  - source: ecb
    series_id: ECB.ESTR
    name: "Euro short-term rate"
    category: money_market
    unit: percent
    frequency: business_daily
    native_identifier: "EST/B.EU000A2X2A25.WT"
    availability_precision: CONSERVATIVE_DATE
    backfill_class: HISTORICAL_CONSERVATIVE
    conservative_release_lag_hours: 36
