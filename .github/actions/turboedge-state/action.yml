name: "TurboEdge: restore encrypted state"
description: >-
  Set up uv/Python, verify TURBOEDGE_STATE_KEY, and restore + unpack the
  encrypted state artifact from the latest usable prior successful
  pipeline.yml run. Refuses to silently continue with an empty state unless
  this is a genuine first run of the workflow, or `allow_fresh_state` was
  explicitly requested (see the restore step below for the full decision
  table). If no usable GitHub Actions artifact is found despite prior
  successful runs, an optional durable state backend (Phase H,
  turboedge.state.backend -- TURBOEDGE_STATE_BACKEND env var) is tried as a
  fallback BEFORE that case aborts; this makes the "no usable artifact"
  case narrower, never wider -- see the restore step below. Requires the
  caller's job to have already run `actions/checkout` (a local composite
  action can only be resolved after checkout) and to hold `actions: read`
  (or `actions: write`) so `gh run list`/`gh run download` can see prior
  runs and their artifacts.

inputs:
  state_key:
    description: "Value of the TURBOEDGE_STATE_KEY repo secret."
    required: true
  mode:
    description: "Pipeline mode this job is running (scan/eod/weekly/monthly); used only for log/summary text."
    required: true
  allow_fresh_state:
    description: >-
      "true" to deliberately allow a fresh, empty state when no usable
      artifact is found despite prior successful runs. Only meaningful for a
      manual workflow_dispatch reset -- on a schedule trigger this input is
      never set, so a missing artifact always aborts the run rather than
      silently starting empty.
    required: false
    default: "false"
  github_token:
    description: >-
      Token for `gh run list` / `gh run download`. Pass the github.token
      expression at the call site (in pipeline.yml). Do not write that
      expression here: GitHub template-evaluates this manifest, the `github`
      context does not exist in a composite action, and the whole action then
      fails to load.
    required: true

outputs:
  state_note:
    description: "One-line, job-summary-safe note describing an out-of-the-ordinary state restore (empty string on a normal restore)."
    value: ${{ steps.restore.outputs.state_note }}

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true

    - name: Install Python 3.12
      shell: bash
      run: uv python install 3.12

    - name: Install dependencies
      shell: bash
      # --extra state-remote pulls in boto3 unconditionally (cheap: a few
      # MB) so `turboedge state backend *` works in every job the moment
      # TURBOEDGE_STATE_BACKEND=s3 is configured, without having to also
      # edit this install step -- see docs/durable_state.md.
      run: uv sync --locked --extra state-remote

    - name: Create directories
      shell: bash
      run: mkdir -p state reports

    - name: Verify TURBOEDGE_STATE_KEY is configured
      shell: bash
      env:
        STATE_KEY: ${{ inputs.state_key }}
      run: |
        set -euo pipefail
        if [[ -z "${STATE_KEY}" ]]; then
          echo "::error::TURBOEDGE_STATE_KEY secret is not set -- refusing to run with an unencrypted state fallback. Generate one with: python -c \"import secrets;print(secrets.token_urlsafe(32))\" and add it under Settings > Secrets and variables > Actions."
          exit 1
        fi

    # ------------------------------------------------------------------
    # Restore logic. Three cases, handled explicitly -- silent data loss
    # (starting from an empty state without anyone noticing, which used to
    # happen whenever the artifact search came up empty for *any* reason)
    # is exactly what this step exists to prevent:
    #
    #   A. No previous successful pipeline.yml run exists at all -- a
    #      genuine first run. A fresh, empty state is expected and fine;
    #      log it and surface it in the job summary.
    #   B. Previous successful runs exist, but none of the last 50 have a
    #      usable `turboedge-state-enc` artifact (expired past its 14-day
    #      retention window, never uploaded, or the download failed).
    #      Before giving up, try the optional durable state backend (Phase
    #      H, turboedge.state.backend) if TURBOEDGE_STATE_BACKEND is
    #      configured -- see "Backend fallback" below. Only if THAT also
    #      delivers nothing does this abort loudly (`::error::` + exit 1) --
    #      UNLESS `allow_fresh_state` was explicitly passed in via
    #      workflow_dispatch, in which case a forced fresh start is logged
    #      loudly (`::warning::` + summary).
    #   C. A usable artifact was found -- restore it normally.
    #
    # Search depth is 50 successful runs (not 20): scan runs 5x/day but
    # weekly/monthly run far less often, so 20 runs of *this* workflow can
    # be far short of covering even the lean artifact's 14-day retention
    # window once scan/eod runs are interleaved in the same run history
    # (roughly 30+ runs/week across all modes).
    #
    # Backend fallback (Phase H, "dauerhafte Lernhistorie"): this only
    # makes case B NARROWER, never wider -- case A (genuine first run) is
    # untouched, and case C (a usable artifact found) never even reaches
    # the backend check. TURBOEDGE_STATE_BACKEND/TURBOEDGE_STATE_S3_* are
    # sourced from job-level env (pipeline.yml, from repo secrets); when
    # unset, `state backend get` fails fast without attempting any network
    # call, so the behavior for anyone who has not opted into a backend is
    # byte-for-byte identical to before this fallback existed. See
    # docs/durable_state.md and turboedge.state.backend's module docstring.
    # ------------------------------------------------------------------
    - name: Restore encrypted state from the latest usable successful pipeline run
      id: restore
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        ALLOW_FRESH_STATE: ${{ inputs.allow_fresh_state }}
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        echo "Restoring encrypted state for pipeline mode: ${MODE}"
        mkdir -p state-download

        if ! total_success=$(gh run list --workflow pipeline.yml --status success --json databaseId --jq 'length'); then
          echo "::error::'gh run list' failed while checking for prior successful pipeline.yml runs -- aborting rather than silently treating this as a first run. Check that the token has 'actions: read' and that the API is reachable."
          exit 1
        fi
        total_success="${total_success:-0}"

        if [[ "${total_success}" -eq 0 ]]; then
          note="No previous successful pipeline.yml run exists yet -- this is a genuine first run, starting with a fresh, empty state."
          echo "${note}"
          {
            echo "state_note=${note}"
            echo "allow_missing=true"
          } >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        if ! run_ids=$(gh run list --workflow pipeline.yml --status success --json databaseId --limit 50 --jq '.[].databaseId'); then
          echo "::error::'gh run list' failed while enumerating candidate runs for state restore -- aborting rather than silently falling back to an empty state."
          exit 1
        fi

        found_run_id=""
        for run_id in ${run_ids}; do
          if gh run download "${run_id}" -n turboedge-state-enc -D state-download 2>/dev/null; then
            echo "Restored turboedge-state-enc artifact from pipeline.yml run ${run_id}"
            found_run_id="${run_id}"
            break
          fi
        done

        # Backend fallback (Phase H) -- only reached when no usable GitHub
        # Actions artifact was found above. `state backend get` fails fast
        # (no network call) if TURBOEDGE_STATE_BACKEND is unset, so this is
        # a no-op for anyone who has not opted into a durable backend.
        if [[ -z "${found_run_id}" ]]; then
          echo "No usable turboedge-state-enc artifact found in the last 50 successful runs -- trying the optional durable state backend before giving up."
          mkdir -p state-download
          if uv run turboedge --state-dir ./state state backend get --key lean --out state-download/state.tar.enc; then
            found_run_id="backend"
          else
            echo "::warning::Durable state backend restore did not produce a usable archive (not configured, unreachable, or no versions yet for key 'lean') -- falling back to the artifact abort/allow_fresh_state logic below."
          fi
        fi

        if [[ -n "${found_run_id}" ]]; then
          if [[ "${found_run_id}" == "backend" ]]; then
            note="No usable turboedge-state-enc artifact was found in the last 50 successful pipeline.yml runs -- restored state from the durable state backend (TURBOEDGE_STATE_BACKEND) instead. See docs/durable_state.md."
            echo "::warning::${note}"
          else
            note=""
          fi
          {
            echo "state_note=${note}"
            echo "allow_missing=false"
          } >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        if [[ "${ALLOW_FRESH_STATE}" == "true" ]]; then
          note="allow_fresh_state=true was explicitly requested via workflow_dispatch: no usable turboedge-state-enc artifact and no usable durable-backend version were found (out of ${total_success} successful runs total), so a FRESH, EMPTY state was forced. Forward-ledger, posteriors, model weights and product history from before this point are being abandoned deliberately."
          echo "::warning::${note}"
          {
            echo "state_note=${note}"
            echo "allow_missing=true"
          } >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        echo "::error::${total_success} prior successful pipeline.yml run(s) exist, but none of the last 50 have a usable turboedge-state-enc artifact (expired past its 14-day retention window, missing, or a failed download), and the optional durable state backend (TURBOEDGE_STATE_BACKEND) delivered nothing either (not configured, unreachable, or no versions yet). Refusing to silently continue with an empty state -- that would discard the forward-ledger, posteriors, model weights and product history without anyone noticing. If this reset is intentional, re-run manually via workflow_dispatch with allow_fresh_state=true. See docs/durable_state.md to set up a durable backend so this situation stops being a hard stop."
        exit 1

    # There used to be a weekly-only step here that additively merged a
    # `turboedge-state-full-enc` artifact's state/snapshots/ (Parquet) back
    # onto this lean restore. That mechanism is gone: the weekly job no
    # longer packs state/snapshots/ into anything (pipeline.yml's weekly job
    # now packs the same LEAN shape a second time, just under a longer
    # retention, as a plain DuckDB/ledger/registry/trials restore point --
    # see its "Pack and upload state backup" step), because it was broken --
    # `weekly` never scans, so it could only ever re-upload whatever Parquet
    # history had already accumulated before the scheme shipped, never
    # anything a scan run wrote afterwards. The accumulated Parquet archive
    # is now kept durable incrementally instead: every scan run packs and
    # uploads ONLY the snapshot file(s) it itself just wrote (`state
    # pack-snapshots`, the scan job's "Pack incremental Parquet snapshot
    # artifact" step) as its own small artifact, so nothing here needs to
    # merge anything back in on restore -- see state/archive.py's module
    # docstring ("Parquet archiving") for the full history.
    - name: Unpack state
      shell: bash
      env:
        TURBOEDGE_STATE_KEY: ${{ inputs.state_key }}
        ALLOW_MISSING: ${{ steps.restore.outputs.allow_missing }}
      run: |
        set -euo pipefail
        if [[ "${ALLOW_MISSING}" == "true" ]]; then
          uv run turboedge --state-dir ./state state unpack --in state-download/state.tar.enc --allow-missing
        else
          uv run turboedge --state-dir ./state state unpack --in state-download/state.tar.enc
        fi
