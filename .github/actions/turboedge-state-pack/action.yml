name: "TurboEdge: pack and upload state"
description: >-
  Pack the state directory (`turboedge state pack`) and upload it as a
  workflow artifact. Two shapes share this action, selected by
  `include_snapshots`: the small, lean package (state/snapshots/ -- the
  immutable per-run Parquet archive -- excluded) every scan/eod/monthly
  pipeline run packs several times a day, and the periodic full package
  (snapshots included) the weekly job additionally uploads under a
  separate, longer-retained artifact name. `actions/upload-artifact` is a
  normal action step and works fine inside a composite action -- the only
  composite-specific gotchas are that `run:` steps need their own `shell:`
  and that a step's `if:` can only see prior steps *within this composite*,
  not the calling job. Because of that second point, callers MUST gate the
  call to this action with `if: success()` (never `always()`) so a failed
  mode step never uploads a broken/incomplete state -- overwriting the
  artifact history with bad state would corrupt every future restore.

inputs:
  state_key:
    description: "Value of the TURBOEDGE_STATE_KEY repo secret."
    required: true
  include_snapshots:
    description: >-
      "true" to also pack state/snapshots/ (the immutable per-run Parquet
      archive) -- the periodic full-backup shape. Default "false": the lean
      shape (state/archive.py LEAN_INCLUDE_DIRS) packed several times a day.
    required: false
    default: "false"
  artifact_name:
    description: "Name to upload the packed archive under."
    required: false
    default: "turboedge-state-enc"
  retention_days:
    description: >-
      Artifact retention, in days. The lean package rotates fast (several
      uploads/day, and only the latest is ever restored in the normal
      path) so a short window is enough to cover the restore step's
      50-successful-run fallback search; the full package is the only
      backup of the Parquet archive and gets a much longer window.
    required: false
    default: "14"
  out_file:
    description: "Local filename for the packed archive before upload."
    required: false
    default: "state.tar.enc"

runs:
  using: composite
  steps:
    - name: Pack state
      shell: bash
      env:
        TURBOEDGE_STATE_KEY: ${{ inputs.state_key }}
        INCLUDE_SNAPSHOTS: ${{ inputs.include_snapshots }}
        OUT_FILE: ${{ inputs.out_file }}
      run: |
        set -euo pipefail
        if [[ "${INCLUDE_SNAPSHOTS}" == "true" ]]; then
          uv run turboedge --state-dir ./state state pack --include-snapshots --out "${OUT_FILE}"
        else
          uv run turboedge --state-dir ./state state pack --out "${OUT_FILE}"
        fi

    - name: Upload encrypted state artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.out_file }}
        retention-days: ${{ inputs.retention_days }}
