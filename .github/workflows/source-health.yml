name: Source Health Check

on:
  schedule:
    # Mo–Fri 06:15 UTC (European morning)
    - cron: "15 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Public repository: source-health messages/statuses aren't candidate
  # detail, but this keeps the convention uniform across every workflow --
  # see `turboedge.logging.redact_enabled` / Build Contract v2 W3.
  TURBOEDGE_PUBLIC_LOGS: "1"

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run source health check
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TURBOEDGE_EMAIL_TO: ${{ secrets.TURBOEDGE_EMAIL_TO }}
        run: uv run turboedge --log-format json sources health --json-out reports/source_health.json --email-on-fail

      # No report artifact upload (public repo -- see pipeline.yml's header
      # comment): the JSON written above stays local to the runner and is
      # discarded when it's cleaned up.
