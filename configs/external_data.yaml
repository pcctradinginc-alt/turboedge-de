  # ==== Energy-Charts, verified live 2026-09-28 =======================
  # Four series, deliberately not twenty-one. The pairing is the point:
  # actual load against its own day-ahead forecast is a surprise measure,
  # and surprises move markets where levels do not. Residual load (demand
  # minus wind and solar) is the scarcity measure that drives the price.
  #
  # Raw resolution is PT15M -- 96 observations a day, all stored. But 96
  # quarter-hours of one day are not 96 independent observations, so the
  # declared frequency is daily and the effective sample counts days
  # (spec §36).
  #
  # A 36-hour conservative lag: the grid data settle within a day and the
  # publisher exposes no release time.
  - source: energy_charts
    series_id: EC.LOAD_DE
    name: "German public electricity load, actual"
    category: energy
    unit: mw
    frequency: daily
    native_identifier: "v2/public_power|country=de|load"
    availability_precision: CONSERVATIVE_DATE
    backfill_class: HISTORICAL_CONSERVATIVE
    conservative_release_lag_hours: 36
    notes: >-
      Verified live 2026-09-28: 96 points/day at PT15M. A direct physical
      measurement of German industrial activity, available the same day --
      against 89 days of lag on the Bundesbank's industrial production.

  - source: energy_charts
