# TurboEdge-DE risk gates and integrity tolerances.
# Consumed by ranking/gates.py (WATCH/REJECT/DATA_QUALITY/ACTIONABLE) and pricing/integrity.py.
# ACTIONABLE is technically reachable; in practice, no ACTIONABLE candidate is
# produced today because no forecast model has measured out-of-sample edge.

# Maximum acceptable (ask - bid) / ask before a candidate is rejected.
max_spread_pct: 0.03

# Two DISTINCT quote-freshness gates (Build Contract freshness/duration
# review, 2026-09-14; see ranking/gates.py's GateThresholds docstring for
# the full rationale). The single `max_quote_age_s: 120` this replaced
# conflated two different questions and was measured to be actively broken
# for the second one: in CI (workflow run 34883437354, commit 1fe080e, live
# Xetra hours), DAX's own fetch took 227.1s end-to-end and NDX's 261.4s
# (BNP ~11 paginated requests + gettex ~20 + Citi, all rate-limited to
# <=1 req/1.5s/host and, before this session's parallelization fix in
# pipeline/universe.py, run one adapter strictly after another) -- so
# EVERY DAX product's decision-time age (quote_timestamp to evaluation_time,
# set only after every source finished) had a measured MINIMUM of 171.5s,
# already above the 120s cutoff -- no product could pass regardless of how
# fresh the source's own data was. Result: 11,060 of 11,114 DAX candidates
# and 7,059 of 10,566 NDX candidates REJECTed on quote staleness (NDX lower
# only because leverage_out_of_range/barrier_distance_too_small pre-empt it
# for more candidates), drowning out every other signal in
# reject_reason_counts. Splitting the check removes that false coupling
# entirely; the two thresholds below are each derived from the ONE
# measurement that actually answers its own question, never from the
# pipeline's own runtime, which only belongs on the decision-time side.
#
# Source-side data quality: is retrieved_at - quote_timestamp small, i.e.
# did the ISSUER hand us a quote that was already fresh? This must be (and
# is) measured from each product's OWN retrieval timestamp, never from
# evaluation_time -- otherwise it silently re-measures the pipeline's own
# runtime under a different name.
#
# Measured directly from state/turboedge.duckdb's product_snapshots with:
#   SELECT issuer, count(*),
#          min(epoch(retrieved_at) - epoch(quote_timestamp)),
#          quantile_cont(epoch(retrieved_at) - epoch(quote_timestamp), 0.5),
#          quantile_cont(epoch(retrieved_at) - epoch(quote_timestamp), 0.9),
#          max(epoch(retrieved_at) - epoch(quote_timestamp))
#   FROM product_snapshots WHERE quote_timestamp IS NOT NULL
#   GROUP BY issuer;
# Reproduced 2026-09-14 against the accumulated local state (69,424 rows,
# retrieved_at spanning 2026-09-11 10:45 to 2026-09-14 21:29 CEST across
# every local scan-all run this session, not a single isolated run -- an
# EARLIER version of this comment quoted a smaller same-day snapshot before
# further local runs added rows, which shifted BNP's p90/UniCredit's max
# materially; re-run the query above against the live database before
# trusting any number here again). n / min_s / p50_s / p90_s / max_s per
# issuer: BNP Paribas 66,418 / -36.6 / -4.1 / 134.4 / 11,473.0; UniCredit
# 1,162 / 52.5 / 170.6 / 301.7 / 9,982.7; HSBC 582 / -11.7 / 171.4 / 363.8 /
# 595.5; Goldman Sachs 1,187 / -6.0 / 169.5 / 423.8 / 2,158,027.4 (HSBC/
# UniCredit/Goldman Sachs are gettex-relayed market-maker quotes, all three
# issued through the same gettex feed with no anti-bot throttling of their
# own -- the wide issuer-to-issuer spread is each market maker's own update
# cadence, not anything this pipeline controls); Citigroup 75 / 744.9 /
# 797.3 / 999.8 / 1,085.3 (Citi's feed is explicitly closing-price/partial-
# coverage only, CLAUDE.md "Data sources" -- structurally slower-cadence by
# design, not a pipeline defect). Rows exceeding a 900s cutoff, by issuer:
# BNP 39/66,418; Goldman Sachs 12/1,187; UniCredit 1/1,162; HSBC 0/582;
# Citigroup 34/75.
#
# LIMITATION -- source/local clock offset: BNP's median is *negative*
# (-4.1s) and its minimum is -36.6s; Goldman Sachs and HSBC also have small
# negative minimums (-6.0s / -11.7s). This means quote_timestamp
# occasionally sits a few seconds to tens of seconds AFTER this snapshot's
# own retrieved_at -- not genuinely a quote "from the future", but a small,
# real clock offset between the issuer's own clock and this process's
# clock (retrieved_at is stamped once per adapter fetch_products() call,
# see adapters/issuer_feeds.py/gettex.py). Harmless for this 900s
# threshold (a negative age trivially passes) and does not affect
# universe/discover.py's `_pick_winner`, which sorts candidates directly by
# `quote_timestamp` and never touches `retrieved_at` -- but it does mean
# every source_quote_age_s value here carries an unremoved, unmeasured
# systematic offset of up to several tens of seconds; do not read the
# small end of this distribution as sub-second-precise.
#
# 900s sits above every issuer's routine p90 (so BNP/gettex-relayed
# candidates are essentially never rejected here purely for their normal
# per-source cadence) while still well below the observed outlier tail
# (11,473s / 2,158,027s) this gate exists to catch, and correctly flags
# roughly the stalest half of Citi's closing-price rows as
# "source_quote_stale" (accurate -- a closing price genuinely isn't a fresh
# live quote: 34 of 75 measured rows), while still evaluating the fresher
# half on their own merits. Verified live (2026-09-14 post-fix local run):
# the Goldman Sachs 25-day-old quote (DE000GN0E3D8, source age 2,158,028s)
# and a BNP outlier (DE000BY6V0W5, source age 9,695s) both still REJECT
# with "source_quote_stale" under this threshold -- this gate is set to
# catch genuinely stale source data, not to improve category counts by
# letting real staleness through.
max_source_quote_age_s: 900

# Trading relevance at decision time: is quote_timestamp still fresh at
# evaluation_time, i.e. is the proposal actually based on a current price by
# the time we act on it? MUST exceed this pipeline's own realistic
# multi-source fetch duration (see universe.py's per-adapter fetch,
# `pipeline/scan.py`'s `evaluation_time = clock()` right after that fetch
# completes) -- a threshold below the fetch duration rejects the entire
# universe systematically regardless of source data quality (the exact CI
# failure mode measured above: fetch_duration_s 227.1s/261.4s > the old
# 120s cutoff for EVERY candidate). Measured fetch_duration_s, same commit
# lineage: pre-parallelization CI (run 34883437354) 227.1s DAX / 261.4s NDX
# -- CI is consistently slower than local here (higher latency to the
# German/US issuer hosts from GitHub's network than this session's local
# connection), local pre-parallelization 81.0s DAX / 74.9s NDX. This
# session's parallelization fix (pipeline/universe.py: concurrent
# per-adapter fetch, one thread per host, since BNP/Citi/gettex are three
# independent hosts and the >=1.5s/request politeness limit is already
# enforced per-host, not globally -- never parallelized WITHIN one host's
# own request stream) re-measured locally at 49.9s DAX / 57.4s NDX (~1.4-1.6x
# faster, now bounded by the single slowest adapter -- BNP at 33-41s here --
# instead of the sum of all three), and in CI (workflow run 34888059675,
# commit 90513f5, same-day) at 186.4s DAX / 128.3s NDX -- confirming the
# effect survives CI's noisier, slower network path even though the
# absolute improvement there is smaller and less consistent than locally
# (network-bound, not just rate-limit-bound). 450s (7.5 minutes) was set,
# BEFORE that confirming CI run existed, with a >1.7x safety margin over
# the worst PRE-fix CI figure (261.4s) specifically so it would already be
# safe even if CI's network conditions had erased the entire
# parallelization gain on a given day; the post-fix CI run above (186.4s
# worst case) confirms an even wider realized margin (>2.4x) without this
# value needing to be tightened.
max_quote_age_at_decision_s: 450

# Leverage band. Products outside this band are rejected outright.
min_leverage: 2.0
max_leverage: 20.0

# Minimum distance from spot to the knockout barrier, expressed in EWMA sigma
# units of the underlying, below which a candidate is rejected as too close
# to knockout.
min_distance_to_barrier_sigma: 1.0

integrity_tolerances:
  # Band around 10^k (k != 0, |k| <= 3) within which implied_underlying /
  # consensus is flagged as a probable ratio/Bezugsverhaltnis factor error.
  ratio_factor_tolerance_pct: 0.02
  # Floating point epsilon allowed before "bid <= ask" is treated as violated.
  bid_ask_epsilon: 0.0005
  # Day-over-day relative jump in financing_level treated as implausible data
  # (separate from the financing-spread adjustment-suspected threshold below).
  max_financing_level_jump_pct: 0.05
  # Coarse (mid - intrinsic) / ask "raw premium" ratio above which
  # pricing/integrity.check_product warns "premium_pct_high".
  margin_warn_pct: 0.15

# Reference trade notional (EUR) used by ranking/liquidity.py's
# quote_size_coverage: how much of a position of this size the displayed ask
# size could fill, as one of the four liquidity_factor sub-scores.
required_notional_eur: 1000.0

# Financing spread inference (pricing/financing.py, financing_spread_history):
# implied_financing_spread() returns an ANNUALIZED spread (the day-over-day
# financing-level change scaled by 360/dt, not the raw price jump itself).
# This threshold is a plausibility band on that ANNUALIZED implied spread:
# any consecutive-pair spread whose absolute value exceeds it is treated as a
# dividend/roll adjustment ("adjustment_suspected") and excluded from the
# spread history rather than used directly.
financing_adjustment_jump_threshold_pct: 0.08

# Fallback financing spread (decimal, e.g. 0.025 = 2.5%) used by
# decompose_ask() when no clean financing-level history is available for an
# ISIN.
default_financing_spread: 0.025

# Fallback reference rate (decimal) used when the ECB EST adapter is
# unavailable and no config override applies.
reference_rate_fallback: 0.03

# Build Contract BEFUND 1: maximum relative deviation |ref - consensus| /
# consensus tolerated before pipeline.scan._resolve_spot rejects a source's
# underlying_price_ref (even with a fresh own timestamp) in favor of the
# cross-issuer consensus spot. Measured on a live BNP+Citi DAX scan
# (2026-09-11, docs/data_sources.md): the reference price is batched
# independently of per-product bid/ask and can drift ~0.01-0.1%+ from the
# quotes it is supposedly synchronous with. 0.002 (0.2%, ~50 DAX points at
# ~25500) is comfortably above normal quote-to-quote noise but tight enough
# to catch a genuinely stale/desynced reference price.
spot_ref_max_deviation_pct: 0.002
